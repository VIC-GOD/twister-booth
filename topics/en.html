function review(spoken){
  $("#lamp").classList.remove("on");
  const boxes=U.checks.map((c,k)=>{const i=el("input",{type:"checkbox",id:"ck"+k});return{i,node:el("label",{for:"ck"+k},i,c)}});
  const m=Math.floor(spoken/60),s=spoken%60;
  $("#stage").replaceChildren(el("div",{class:"card",style:`--cat:var(--c${card.c})`},
    el("span",{class:"cat"},CATS[card.c]),
    el("div",{class:"topic",style:"font-size:clamp(22px,4.5vw,30px);flex:none"},card.t),
    el("div",{},U.spoke(m,s)),
    el("div",{class:"checks"},boxes.map(b=>b.node)),
    el("div",{class:"row"},el("button",{class:"btn",onclick:()=>{
      const t=dayKey(),y=dayKey(new Date(Date.now()-864e5));
      if(S.lastDay!==t){S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=t}
      S.speeches++;S.seconds+=spoken;if(!S.used.includes(card.id))S.used.push(card.id);save();meters();
      const n=boxes.filter(b=>b.i.checked).length;toast(n===3?U.great:U.logged);draw();
    }},U.logNext),el("button",{class:"btn ghost",onclick:()=>showCard(false)},U.again))));
}
controls();meters();draw();
</script>
