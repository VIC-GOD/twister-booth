<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>God Love</title>
<meta name="description" content="God Love : apprendre l'interprétation, la traduction et la prise de parole. Cours, exercices corrigés, dictionnaire et jeux.">
<meta name="theme-color" content="#16213e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16213e;--muted:#5e6678;--bg:#f6f4f0;--panel:#fff;--line:#e4e0d8;--brand:#d9415f;--gold:#f2b134;--ok:#1f9d63;--bad:#d64545;--warn:#e08a00;--r:16px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Familjen Grotesk",system-ui,sans-serif}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
h1{font-size:28px;line-height:1.15;margin:8px 0 6px}h2{font-size:19px;margin:26px 0 10px}h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)}.sm{font-size:14px}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px max(4vw,14px);background:rgba(246,244,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:20px;text-decoration:none;letter-spacing:-.3px}.logo b{color:var(--brand);margin:0 2px}
.beta{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--gold);color:#3a2700;border-radius:6px;padding:2px 6px}
.sp{flex:1}.stat{font-weight:700;font-size:15px}.me{font-size:20px;text-decoration:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
main{max-width:720px;margin:0 auto;padding:12px max(4vw,14px) 110px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav a{display:grid;justify-items:center;gap:1px;text-decoration:none;font-size:12px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:12px}
#nav a span{font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.7}
#nav a.on{color:var(--ink)}#nav a.on span{filter:none;opacity:1}
@media(min-width:900px){#nav{top:64px;bottom:auto;left:max(16px,calc(50vw - 600px));right:auto;width:150px;grid-template-columns:1fr;border:1px solid var(--line);border-radius:var(--r);padding:8px;gap:2px}
 #nav a{grid-template-columns:30px 1fr;justify-items:start;align-items:center;font-size:15px;padding:10px}#nav a.on{background:var(--bg)}}
.card{display:grid;grid-template-columns:44px 1fr 18px;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0;text-decoration:none;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(22,33,62,.08)}
.card .ci{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--bg);border-radius:12px}
.card b{display:block}.card small{display:block;color:var(--muted);font-size:14px;line-height:1.4}.card .go{color:var(--muted);font-size:22px}
.card.dim{opacity:.55}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tags em{font-style:normal;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}.tags em.y{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps .stepl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);margin-top:12px}
.goalbox{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px}.goalbox small{opacity:.8}
.bar{height:10px;background:rgba(255,255,255,.18);border-radius:6px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.langsum{color:var(--muted);font-size:14px;margin-top:24px}
.back{display:inline-block;text-decoration:none;color:var(--muted);font-weight:600;margin:4px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prog{background:#fff7e6;border:1px dashed var(--gold);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}.prog small{display:block;color:var(--muted)}
.lesson{display:grid;grid-template-columns:34px 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0}
.lesson .num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.lesson h3{margin:4px 0}.lesson p{margin:0;font-family:"Source Serif 4",Georgia,serif}
.tech{padding-left:0;list-style:none;counter-reset:t}.tech li{counter-increment:t;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 48px;margin:8px 0;position:relative}
.tech li::before{content:counter(t);position:absolute;left:12px;top:11px;width:26px;height:26px;border-radius:8px;background:var(--gold);font-weight:700;display:grid;place-items:center;font-size:14px}
.vids{list-style:none;padding:0;margin:0}.vids li a{display:block;padding:10px 12px;margin:6px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:600}
details summary{cursor:pointer;font-weight:600;margin:14px 0 6px}
.crit{display:grid;grid-template-columns:1fr 120px 24px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.hist{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel)}.hist th,.hist td{border:1px solid var(--line);padding:4px 6px;text-align:center}
button.pri{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:700;font-size:17px;cursor:pointer;min-height:48px}
button.pri:disabled{opacity:.4;cursor:default}
button.ghost{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;min-height:44px}
button.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.lchip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.lchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.lchip:disabled{opacity:.35}
.lchip em{font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;margin-left:6px;opacity:.7}
.ob{max-width:560px;margin:0 auto;padding-top:24px}
.brand.big{text-align:center;margin:10px 0 18px}.brand.big .logo{font-size:40px}.brand.big p{color:var(--muted);margin:4px 0}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:28px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--brand)}
.opts{display:grid;gap:10px}.opt{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.opt .oi{font-size:26px}.opt small{display:block;color:var(--muted);font-size:14px}.opt[aria-pressed=true]{border-color:var(--brand);background:#fff1f4}
.obnav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}
.src{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px;margin:10px 0}.src small{opacity:.7;text-transform:uppercase;font-size:12px;letter-spacing:.6px}.src p{margin:4px 0 0;font-size:21px;font-family:"Source Serif 4",Georgia,serif}
textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:19px;background:var(--panel);resize:vertical}textarea:focus,input:focus{outline:none;border-color:var(--brand)}
.result{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}.result.perfect{border-color:var(--ok);background:#effaf4}
.marked{font-size:19px;line-height:2.1}.tk{padding:2px 4px;border-radius:6px}.tk.ok{background:#e3f5ea}.tk.bad{background:#fde3e3;text-decoration:line-through;text-decoration-color:var(--bad)}
.tk.form{background:#fff0d6}.tk.extra{background:#fde3e3;text-decoration:line-through}.tk.miss{background:#e7ecff;color:#2c49c9;font-weight:700}
.tk sup{color:var(--ok);font-weight:700;margin-left:3px;text-decoration:none;display:inline-block}
.notes{padding-left:20px}.notes li{margin:8px 0}.whyx{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.refa small{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}.refa p{margin:2px 0;font-weight:600}.refa .alt{font-weight:400}
.scorel{font-size:15px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 14px}.exm li{font-family:"Source Serif 4",Georgia,serif;margin:4px 0}
.trap{background:#fff7e6;border-radius:12px;padding:10px 12px}.trap p{margin:4px 0 0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0}.q p{margin:4px 0;font-size:18px}.blank{font-weight:700;color:var(--brand)}
button.right{border-color:var(--ok);background:#e3f5ea}button.wrongb{border-color:var(--bad);background:#fde3e3}.fb{font-size:15px!important}
.searchbar input{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:19px;background:var(--panel)}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0}
.dtype{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--brand)}.dtag{font-size:11px;color:var(--muted);margin-left:8px}
.dl{display:grid;grid-template-columns:34px 1fr;gap:8px;margin:4px 0}.dl em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);padding-top:3px}.dl span{font-weight:600}
.flag{width:20px;height:14px;object-fit:cover;border-radius:2px;margin-right:6px;vertical-align:-1px}
.dm{margin:6px 0 0;font-size:15px}.ffl em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}.ffl s{color:var(--bad)}
.ext{margin-top:18px}.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}.kv{display:grid;gap:2px;margin:6px 0}.kv span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header id="top" hidden></header>
<main id="app"></main>
<nav id="nav" hidden aria-label="Navigation"></nav>
<script src="../content/data.js"></script>
<script src="../live/vocab.js"></script>
<script src="../content/pt.js"></script>
<script src="../content/proverbs.js"></script>
<script src="../live/falsefriends.js"></script>
<script src="../live/xp.js"></script>
<script src="catalog.js"></script>
<script src="learn.js"></script>
<script src="practice.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
