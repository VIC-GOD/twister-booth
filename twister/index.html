<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twister Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f0eef4;--panel:#fff;--ink:#16202c;--muted:#5b6675;--line:#d9d5e1;--accent:#4a2f7a;--accent-soft:#ece6f6;
 --fr:#2d5fa8;--en:#b8432f;--de:#a77a12;--sl:#4c7a4a;--l1:#2f7d4f;--l2:#1f5e8c;--l3:#7a2e8c;
 --ok:#2f7d4f;--ok-soft:#e1f1e7;--bad:#b23a3a;--bad-soft:#f7e3e3;--air:#d23b2a;
 --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;--f-body:"Source Serif 4",Georgia,serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#120f18;--panel:#1c1825;--ink:#ebe7f2;--muted:#a39cb2;--line:#322b40;--accent:#b79cf0;--accent-soft:#2b2240;
 --fr:#7fa8ee;--en:#ee8a74;--de:#e2b54a;--sl:#8cc489;--l1:#6cc792;--l2:#6fb0e0;--l3:#d08ae0;--ok:#6cc792;--ok-soft:#163626;--bad:#f08a8a;--bad-soft:#3a1d1f;--air:#ff5a45;color-scheme:dark}}
:root[data-theme=dark]{--bg:#120f18;--panel:#1c1825;--ink:#ebe7f2;--muted:#a39cb2;--line:#322b40;--accent:#b79cf0;--accent-soft:#2b2240;
 --fr:#7fa8ee;--en:#ee8a74;--de:#e2b54a;--sl:#8cc489;--l1:#6cc792;--l2:#6fb0e0;--l3:#d08ae0;--ok:#6cc792;--ok-soft:#163626;--bad:#f08a8a;--bad-soft:#3a1d1f;--air:#ff5a45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}h1{font-size:clamp(28px,5vw,40px)}h2{font-size:22px}
p{margin:0}.lead{color:var(--muted);max-width:62ch}
.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.channels{display:flex;flex-wrap:wrap;gap:8px}.ch{font-family:var(--f-mono);font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}nav.tabs button{flex:0 0 auto}
button{font:inherit;font-family:var(--f-display);font-weight:600;font-size:15px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}button.okb{background:var(--ok-soft);border-color:var(--ok)}button.badb{background:var(--bad-soft);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.spread{justify-content:space-between}
select,input{font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.card{border:1px solid var(--line);border-top:6px solid var(--c,var(--accent));border-radius:12px;padding:18px 20px;display:grid;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.tw{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4.2vw,32px);line-height:1.25}
.tw.long{font-size:clamp(19px,3.2vw,25px)}
.tip{font-style:italic;color:var(--muted);font-size:15.5px}
.clock{font-family:var(--f-mono);font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.air{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;padding:4px 10px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}.air.on{background:var(--air);border-color:var(--air);color:#fff}
.fb{border-radius:8px;padding:10px 12px}.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.mid{background:var(--accent-soft)}
.small{font-size:14.5px;color:var(--muted)}
.ladder{display:flex;gap:6px}.ladder span{flex:1;text-align:center;font-family:var(--f-mono);padding:8px 0;border-radius:8px;border:1px solid var(--line)}
.ladder span.done{background:var(--ok-soft);border-color:var(--ok)}.ladder span.cur{border-color:var(--accent);border-width:2px}
.pips{display:flex;gap:6px;flex-wrap:wrap}.pips i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}.pips i.on{background:var(--ok);border-color:var(--ok)}
.num{font-family:var(--f-mono);font-size:48px;letter-spacing:.15em;text-align:center}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.list .it{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:4px}
.list .it .t{font-family:var(--f-display);font-weight:600;font-size:18px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:640px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats .stat:nth-child(n+4){display:none}.panel{padding:16px}.clock{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

// rough syllable count (vowel groups); fingerspelling counts letters
function units(x){
  if(x.l==="sl") return x.t.replace(/[^A-Z]/g,"").length;
  const s=x.t.toLowerCase().replace(/[^a-zàâäéèêëîïôöùûüÿœæßç' -]/g," ");
  let n=0; for(const w of s.split(/[\s'-]+/)){ if(!w) continue; let g=(w.match(/[aeiouyàâäéèêëîïôöùûüÿœæ]+/g)||[]).length;
    if(x.l!=="de" && /[^l]e$/.test(w) && g>1) g--; // silent final e (EN/FR)
    if(x.l==="fr" && /(es|ent)$/.test(w) && g>1 && w.length>4) g--;
    n+=Math.max(1,g);} return n;
}
// target seconds for three clean repetitions
function target(x){ const rate = x.l==="sl" ? [0,2.5,3,3.5][x.v] : [0,4,4.6,5.2][x.v]; return Math.max(3, Math.round(units(x)*3/rate)); }

 $("#stage").innerHTML=`<p class="small">${LX.partyHow}</p><label style="display:grid;gap:6px"><span class="lbl">${LX.names}</span><textarea id="nm" rows="5" style="font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)">${esc(saved||X.p1+"\n"+X.p2)}</textarea></label><div id="er"></div><div class="row"><button class="primary" id="go">${X.go}</button></div>`;
 $("#go").onclick=()=>{const n=$("#nm").value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,8);if(n.length<2){$("#er").innerHTML=`<div class="fb bad">${LX.addTwo}</div>`;return}
  try{localStorage.setItem("twb-party",n.join("\n"))}catch(e){}st={n,tot:n.map(()=>0),rows:[],round:0};round()};
 function round(){if(st.round>=N){finish();return}const x=pick();st.round++;turn(x,0,[])}
 function board(){return st.n.map((n,i)=>`${esc(n)} ${st.tot[i].toFixed(1)}`).join(" · ")}
 function turn(x,p,res){$("#stage").innerHTML=`<div class="row spread"><span class="lbl">${X.round} ${st.round} / ${N}</span><span class="lbl">${board()}</span></div>
  <h2>${esc(X.turn(st.n[p]))}</h2>${cardHTML(x)}<div class="row spread"><span class="clock" id="clk">0.0 s</span><span class="air" id="air">ON AIR</span></div><div class="row"><button class="primary" id="ss">${X.start}</button></div><div id="js"></div>`;bindSay(x);
  let run=false;$("#ss").onclick=()=>{if(!run){run=true;$("#air").classList.add("on");$("#ss").textContent=X.stop;startClock($("#clk"))}else{const el=stopClock();$("#air").classList.remove("on");$("#ss").disabled=true;
   $("#js").innerHTML=`<p class="lbl">${X.slips}</p><div class="row">${[0,1,2,3].map(k=>`<button data-k="${k}" class="${k?"badb":"okb"}">${k}${k===3?"+":""}</button>`).join("")}</div>`;
   $("#js").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,sc=el+2*k;st.tot[p]+=sc;res.push([el,k]);if(p<st.n.length-1)turn(x,p+1,res);else{st.rows.push(res);round()}})}}}
 function finish(){practised();stats();const order=st.n.map((n,i)=>i).sort((a,b)=>st.tot[a]-st.tot[b]);const w=order[0],tie=Math.round(st.tot[order[0]]*10)===Math.round(st.tot[order[1]]*10);
  $("#stage").innerHTML=`<h2>${tie?X.tie:esc(X.wins(st.n[w]))}</h2><div class="scroll" style="overflow-x:auto"><table><tr><th>#</th>${st.n.map(n=>`<th>${esc(n)}</th>`).join("")}</tr>${st.rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(c=>`<td>${c[0].toFixed(1)} s${c[1]?` +${c[1]}×2`:""}</td>`).join("")}</tr>`).join("")}<tr><th>${X.total}</th>${st.tot.map(t=>`<th>${t.toFixed(1)} s</th>`).join("")}</tr></table></div><div class="row"><button class="primary" id="pa">${X.playAgain}</button></div>`;$("#pa").onclick=()=>go("duel")}};

// ---------- live room: everyone on their own device ----------
let ROOM=null; const roomReady=window.TWROOM?Promise.resolve(window.TWROOM).then(r=>{ROOM=r;return r}):(window.claude&&claude.use)?claude.use("room").then(r=>{ROOM=r;return r}).catch(()=>null):Promise.resolve(null);
const LV_={room:null,code:"",host:false,offs:[],sb:{},res:{},hist:[],g:null,myRes:null,hs:0};
function liveLeave(){LV_.offs.forEach(f=>{try{f()}catch(e){}});LV_.offs=[];if(LV_.room){LV_.room.leave().catch(()=>{});}Object.assign(LV_,{room:null,code:"",host:false,sb:{},hist:[],g:null,myRes:null})}
const clip=(s,n)=>String(s||"").replace(/[\u0000-\u001f​-‏‪-‮⁠-⁯﻿]/g,"").slice(0,n);
M.live=async()=>{filters(false);
 if(LV_.room){liveRender();return}
 const nm=(()=>{try{return localStorage.getItem("twb-name")||""}catch(e){return ""}})();
 $("#stage").innerHTML=`<h2>${LX.tab}</h2><p>${LX.intro}</p><p class="small">${LX.access}</p>
 <div class="row"><label class="row" style="gap:6px"><span class="lbl">${LX.name}</span><input id="lnm" maxlength="16" value="${esc(nm)}" autocomplete="off"></label></div>
 <div class="row"><button class="primary" id="lcr">${LX.create}</button><span class="small">·</span><input id="lcd" maxlength="4" placeholder="${LX.code}" aria-label="${LX.code}" autocomplete="off" style="width:8em;text-transform:uppercase;letter-spacing:.2em"><button id="ljn">${LX.join}</button></div><div id="lmsg"></div>`;
 const r=await Promise.race([roomReady,new Promise(res=>setTimeout(()=>res(ROOM),11000))]);
 if(mode!=="live")return;
 if(!r){$("#lmsg").innerHTML=`<div class="fb mid">${LX.noRoom}</div><div class="row"><button id="lpt">${LX.party}</button></div>`;$("#lcr").disabled=$("#ljn").disabled=true;$("#lpt").onclick=()=>go("duel");return}
 const enter=async host=>{const name=clip($("#lnm").value.trim(),16);let code=host?Array.from({length:4},()=>"abcdefghjkmnpqrstuvwxyz"[Math.floor(Math.random()*23)]).join(""):$("#lcd").value.trim().toLowerCase();
  if(!name||!/^[a-z]{4}$/.test(code)){$("#lmsg").innerHTML=`<div class="fb bad">${LX.bad}</div>`;return}
  try{localStorage.setItem("twb-name",name)}catch(e){}
  $("#lmsg").innerHTML=`<p class="small">${LX.joining}</p>`;
  try{const room=await r.join("twister-"+ED.id+"-"+code,host);Object.assign(LV_,{room,code,host,name,hs:Date.now(),sb:{},hist:[],myRes:null});
   if(host){LV_.g={st:"lobby",r:0,n:5,m:"speed",v:"all",l:"all"};}
   await room.presence({name,host:host?LV_.hs:null,g:host?LV_.g:null,res:null});
   LV_.offs.push(room.onPeers(()=>{if(mode==="live")liveRender()}));liveRender()}
  catch(e){$("#lmsg").innerHTML=`<div class="fb bad">${LX.fail}</div>`}};
 $("#lcr").onclick=()=>enter(true);$("#ljn").onclick=()=>enter(false);$("#lcd").onkeydown=e=>{if(e.key==="Enter")enter(false)}};
function livePeers(){const ps=LV_.room?LV_.room.peers().filter(p=>p.kind==="viewer"&&p.presence&&p.presence.name):[];return ps}
function liveHost(ps){const hs=ps.filter(p=>typeof p.presence.host==="number"&&p.presence.g).sort((a,b)=>a.presence.host-b.presence.host);return hs[0]||null}
function pushG(){LV_.room.presence({g:LV_.g}).catch(()=>{})}
function roundPoints(rows,card,split){const clean=rows.filter(r=>r.res&&r.res.k===0).map(r=>r.res.t);const best=clean.length?Math.min(...clean):null;
 return rows.map(r=>{const x=r.res;if(!x)return {...r,p:0};let p=x.k===0?(x.t<=card.s?3:2):x.k===1?1:0;if(x.k===0&&x.t===best)p++;if(split&&x.ok)p++;return {...r,p}})}
let liveLocal={r:-1,phase:"",num:"",el:0,k:null};
function liveRender(){const room=LV_.room;if(!room)return;const ps=livePeers();const hp=liveHost(ps);const me=ps.find(p=>p.sameTab);
 const amHost=!!(hp&&hp.sameTab);const g=amHost?LV_.g:hp&&hp.presence.g;
 const head=`<div class="row spread"><span><span class="lbl">${LX.roomIs}</span> <b class="clock" style="font-size:30px;letter-spacing:.2em">${LV_.code.toUpperCase()}</b></span><button id="llv">${LX.leave}</button></div>`;
 const plist=`<div class="row" style="gap:6px">${ps.map(p=>`<span class="ch">${esc(clip(p.presence.name,16))}${p.sameTab?` (${LX.you})`:""}${hp&&p.peer===hp.peer?` · ${LX.host}`:""}${g&&g.st==="play"&&p.presence.res&&p.presence.res.r===g.r?" ✓":""}</span>`).join("")}</div>`;
 const st=$("#stage");
 if(!hp||!g){st.innerHTML=head+`<div class="fb mid">${LV_.host?LX.joining:LX.hostGone}</div>`+plist;bindLeave();return}
 if(g.st==="lobby"){st.innerHTML=head+`<p class="small">${LX.tell}</p><h3>${LX.players} (${ps.length})</h3>${plist}<p class="small">${LX.scoring}</p>`+(amHost?`<div class="row">
   <label class="row" style="gap:6px"><span class="lbl">${LX.game}</span><select id="lgm"><option value="speed">${LX.mSpeed}</option><option value="split">${LX.mSplit}</option></select></label>
   <label class="row" style="gap:6px"><span class="lbl">${LX.rounds}</span><select id="lrn">${[3,5,8,10].map(n=>`<option ${n===g.n?"selected":""}>${n}</option>`).join("")}</select></label>
   <label class="row" style="gap:6px"><span class="lbl">${X.level}</span><select id="llv2"><option value="all">${X.all}</option>${[1,2,3].map(v=>`<option value="${v}" ${g.v==v?"selected":""}>${v} · ${S.lvl[v]}</option>`).join("")}</select></label>
   ${ED.langs.length>2?`<label class="row" style="gap:6px"><span class="lbl">${X.lang}</span><select id="llg"><option value="all">${X.all}</option>${ED.langs.map(l=>`<option value="${l}" ${g.l===l?"selected":""}>${S.lang[l]}</option>`).join("")}</select></label>`:""}
   </div><div class="row"><button class="primary" id="lst">${LX.start}</button></div>`:`<div class="fb mid">${LX.waitHost}</div>`);
  bindLeave();if(amHost){$("#lgm").value=g.m;$("#lst").onclick=()=>{g.m=$("#lgm").value;g.n=+$("#lrn").value;g.v=$("#llv2").value;g.l=$("#llg")?$("#llg").value:"all";LV_.sb={};LV_.hist=[];g.sb=[];startRound()}}return}
 if(g.st==="play"){const x=DECK.find(c=>c.id===g.id);if(!x)return;
  if(liveLocal.r!==g.r){liveLocal={r:g.r,phase:g.m==="split"?"memo":"ready",el:0,k:null};LV_.myRes=null;room.presence({res:null}).catch(()=>{});}
  const doneN=ps.filter(p=>p.presence.res&&p.presence.res.r===g.r).length;
  const top=head+`<div class="row spread"><span class="lbl">${LX.round} ${g.r} / ${g.n}</span><span class="lbl">${doneN} / ${ps.length} ${LX.done}</span></div>`;
  const hostBar=amHost?`<div class="row"><button id="lsr">${LX.showRes}</button></div>`:"";
  if(liveLocal.phase==="memo"){st.innerHTML=top+`<p class="lbl" style="text-align:center">${X.memo}</p><p class="num">${g.num.replace(/(\d{2})(\d{3})/,"$1 $2")}</p>`+hostBar;bindLeave();bindHost();
   if(!liveLocal.tm)liveLocal.tm=setTimeout(()=>{liveLocal.tm=null;if(liveLocal.r===g.r){liveLocal.phase="ready";liveRender()}},3000);return}
  if(liveLocal.phase==="ready"||liveLocal.phase==="run"){st.innerHTML=top+cardHTML(x)+`<div class="row spread"><span class="clock" id="clk">${liveLocal.phase==="run"?"…":"0.0 s"}</span><span class="air ${liveLocal.phase==="run"?"on":""}" id="air">ON AIR</span></div><div class="row"><button class="primary" id="ss">${liveLocal.phase==="run"?X.stop:X.start}</button></div>`+plist+hostBar;
   bindSay(x);bindLeave();bindHost();if(liveLocal.phase==="run"){clearInterval(tick);tick=setInterval(()=>{const c=$("#clk");if(c)c.textContent=((performance.now()-t0)/1000).toFixed(1)+" s"},50)}
   $("#ss").onclick=()=>{if(liveLocal.phase==="ready"){liveLocal.phase="run";t0=performance.now();liveRender()}else{liveLocal.el=stopClock();liveLocal.phase="judge";liveRender()}};return}
  if(liveLocal.phase==="judge"){st.innerHTML=top+cardHTML(x)+`<p class="clock">${liveLocal.el.toFixed(1)} s</p><p class="lbl">${X.slips}</p><div class="row">${[0,1,2,3].map(k=>`<button data-k="${k}" class="${k?"badb":"okb"} ${liveLocal.k===k?"primary":""}">${k}${k===3?"+":""}</button>`).join("")}</div>
   ${g.m==="split"?`<label class="row"><span class="lbl">${LX.numQ}</span><input id="lni" inputmode="numeric" maxlength="7" autocomplete="off" value="${esc(liveLocal.ni||"")}"></label>`:""}<div class="row"><button class="primary" id="lsb" ${liveLocal.k==null?"disabled":""}>${LX.submit}</button></div>`+hostBar;
   bindSay(x);bindLeave();bindHost();st.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{liveLocal.k=+b.dataset.k;if($("#lni"))liveLocal.ni=$("#lni").value;liveRender()});
   $("#lsb").onclick=()=>{const ok=g.m==="split"?(($("#lni")||{}).value||"").replace(/\D/g,"")===g.num:false;const res={r:g.r,t:+liveLocal.el.toFixed(1),k:liveLocal.k,ok};LV_.myRes=res;liveLocal.phase="sent";
    if(liveLocal.k===0&&(DB.best[x.id]==null||res.t<DB.best[x.id])){DB.best[x.id]=res.t;save()}practised();stats();room.presence({res}).catch(()=>{});liveRender()};return}
  st.innerHTML=top+`<div class="fb ok">${LX.sent}</div>`+plist+hostBar;bindLeave();bindHost();return}
 if(g.st==="res"||g.st==="end"){const rr=g.rr||[],sb=(g.sb||[]).slice().sort((a,b)=>b[1]-a[1]);
  st.innerHTML=head+(g.st==="end"?`<h2>${LX.podium}</h2>`:`<div class="row spread"><h2>${LX.round} ${g.r} / ${g.n}</h2></div><div style="overflow-x:auto"><table><tr><th></th><th>${LX.time}</th><th>${LX.slips}</th><th>${LX.pts}</th></tr>${rr.map(r=>`<tr><td>${esc(clip(r[0],16))}</td><td>${r[1]==null?LX.noRes:r[1].toFixed(1)+" s"}</td><td>${r[2]==null?"":r[2]}${r[3]?" · #✓":""}</td><td>+${r[4]}</td></tr>`).join("")}</table></div>`)+
   `<h3>${LX.total}</h3><table>${sb.map((r,i)=>`<tr><td>${i===0?"★ ":""}${i+1}. ${esc(clip(r[0],16))}</td><td style="text-align:right"><b>${r[1]}</b></td></tr>`).join("")}</table>`+
   (amHost?`<div class="row">${g.st==="end"?`<button class="primary" id="lag">${LX.again}</button>`:g.r>=g.n?`<button class="primary" id="lfn">${LX.finish}</button>`:`<button class="primary" id="lnx">${LX.next}</button>`}</div>`:"");
  bindLeave();if(amHost){if($("#lnx"))$("#lnx").onclick=startRound;if($("#lfn"))$("#lfn").onclick=()=>{g.st="end";pushG();liveRender()};if($("#lag"))$("#lag").onclick=()=>{g.st="lobby";g.r=0;g.sb=[];g.rr=[];LV_.sb={};pushG();liveRender()}}
  if(g.st==="end"){practised();stats()}}}
function bindLeave(){const b=$("#llv");if(b)b.onclick=()=>{liveLeave();go("live")}}
function bindHost(){const b=$("#lsr");if(b)b.onclick=()=>{const g=LV_.g,ps=livePeers(),x=DECK.find(c=>c.id===g.id);
 const rows=roundPoints(ps.map(p=>({k:p.peer,name:clip(p.presence.name,16),res:p.presence.res&&p.presence.res.r===g.r?p.presence.res:null})),x,g.m==="split");
 rows.forEach(r=>{const e=LV_.sb[r.k]||(LV_.sb[r.k]={name:r.name,pts:0});e.name=r.name;e.pts+=r.p});
 g.rr=rows.sort((a,b)=>b.p-a.p).slice(0,24).map(r=>[r.name,r.res?r.res.t:null,r.res?r.res.k:null,r.res&&r.res.ok?1:0,r.p]);
 g.sb=Object.values(LV_.sb).slice(0,30).map(e=>[e.name,e.pts]);g.st="res";delete g.id_;pushG();liveRender()}}
function startRound(){const g=LV_.g;const p=DECK.filter(x=>(g.l==="all"||x.l===g.l)&&(g.v==="all"||x.v==g.v)&&!(g.m==="split"&&false));const x=pick(p.length?p:DECK);
 g.r++;g.id=x.id;g.st="play";g.num=String(Math.floor(10000+Math.random()*90000));g.rr=[];pushG();liveRender()}

M.warm=()=>{filters(false);const steps=X.warmSteps;let i=-1,left=0,iv=null;
 const wp=v=>{const p=DECK.filter(x=>x.v===v&&x.l!=="sl"&&(F.l==="all"||x.l===F.l));return pick(p.length?p:DECK.filter(x=>x.v===v))};
 $("#stage").innerHTML=`<h2>${X.tabs.warm}</h2><ol>${steps.map(s=>`<li><b>${s[0]}</b> <span class="small">(${s[2]} s)</span></li>`).join("")}</ol><div class="row"><button class="primary" id="ws">${X.warmStart}</button></div>`;
 $("#ws").onclick=nextStep;
 function nextStep(){clearInterval(iv);i++;if(i>=steps.length){DB.warm++;save();practised();stats();$("#stage").innerHTML=`<div class="fb ok">${X.warmDone}</div><div class="row"><button id="ag" class="primary">${X.warmStart}</button></div>`;$("#ag").onclick=()=>go("warm");return}
  const s=steps[i],x=s[3]?wp(s[3]):null;left=s[2];
  $("#stage").innerHTML=`<div class="row spread"><span class="lbl">${i+1} / ${steps.length}</span><span class="clock" id="wc">${left}</span></div><div class="bar"><i id="wb" style="width:0%"></i></div><h2>${s[0]}</h2><p>${s[1]}</p>${x?cardHTML(x):""}<div class="row"><button class="primary" id="wn">${X.skip}</button></div>`;
  if(x)bindSay(x);$("#wn").onclick=nextStep;
  iv=setInterval(()=>{if(mode!=="warm"){clearInterval(iv);return}left--;const w=$("#wc");if(!w){clearInterval(iv);return}w.textContent=Math.max(0,left);$("#wb").style.width=(100*(s[2]-left)/s[2])+"%";if(left<=0){clearInterval(iv);w.textContent="✓"}},1000)}};
M.list=()=>{filters(true);const p=pool().slice().sort((a,b)=>a.l.localeCompare(b.l)||a.v-b.v);
 $("#stage").innerHTML=`<input type="search" id="q" placeholder="${X.search}" aria-label="${X.search}"><div class="list" id="ls"></div>`;
 const draw=()=>{const q=$("#q").value.toLowerCase();$("#ls").innerHTML=p.filter(x=>x.t.toLowerCase().includes(q)).map(x=>{const b=DB.best[x.id];
  return `<div class="it"><div class="meta"><span class="tag" style="color:${LV[x.v]}">${x.v} · ${S.lvl[x.v]}</span><span class="tag" style="color:${CV[x.l]}">${S.lang[x.l]}</span><span class="tag" style="color:var(--muted)">${S.cat[x.c]}</span>${x.o?`<span class="tag" style="color:var(--l3)">${X.orig}</span>`:""}</div>
  <div class="t" lang="${x.l==="sl"?"en":x.l}">${esc(x.t)}</div><div class="row spread"><span class="small">${X.target}: ${x.s} s · ${X.best}: ${b!=null?b.toFixed(1)+" s"+(b<=x.s?" ★":""):X.none}</span>${x.l!=="sl"&&"speechSynthesis" in window?`<button data-id="${x.id}">▶ ${X.listen}</button>`:""}</div></div>`}).join("");
  $("#ls").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>speak(DECK.find(x=>x.id===b.dataset.id),0.9))};
 $("#q").oninput=draw;draw()};
let keyHandler=null;document.addEventListener("keydown",e=>keyHandler&&keyHandler(e));
function go(m){mode=m;keyHandler=null;clearInterval(tick);if("speechSynthesis" in window)speechSynthesis.cancel();if(rec&&rec.state==="recording")rec.stop();
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===m));M[m]()}
// ---------- init ----------
$("#lead").textContent=X.lead;
if(ED.switch){const h=document.querySelector("header");const d=document.createElement("div");d.className="row";d.innerHTML=`<label class="row" style="gap:6px"><span class="lbl">Interface</span><select id="uil">${[["en","English"],["fr","Français"],["de","Deutsch"]].map(([k,v])=>`<option value="${k}" ${ED.ui===k?"selected":""}>${v}</option>`).join("")}</select></label>`;h.appendChild(d);$("#uil").onchange=e=>{try{localStorage.setItem("twb-ui",e.target.value)}catch(_){}location.reload()}}$("#foot").textContent=X.saved;
$("#chans").innerHTML=ED.langs.map((l,i)=>`<span class="ch"><span class="dot" style="background:${CV[l]}"></span>${l==="sl"?"ASL":"CH"+(i+1)+" · "+l.toUpperCase()}</span>`).join("");
$("#tabs").innerHTML=[["warm",X.tabs.warm],["speed",X.tabs.speed],["ladder",X.tabs.ladder],["split",X.tabs.split],["live",LX.tab],["duel",LX.party],["list",X.tabs.list]].map(([k,v])=>`<button role="tab" data-m="${k}">${v}</button>`).join("");
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.m));
if("speechSynthesis" in window)speechSynthesis.getVoices();
stats();go("warm");
</script></body></html>
