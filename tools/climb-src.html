<html lang="en">
<head>

<title>Monkey Climb · Interpreter Games</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{--bg:#0f1a14;--panel:#1b2a21;--ink:#f1f6ef;--muted:#a6b8a9;--line:#2e4335;--c:#ffbe0b;--ok:#2fa36b;--bad:#d2493c}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Serif 4",Georgia,serif;overscroll-behavior:none}
h1,h2,button,input,.g{font-family:"Familjen Grotesk",Arial,sans-serif}
button{font-weight:600;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
input{font-size:17px;color:var(--ink);background:#0b130e;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
button.pri{background:var(--c);color:#1a1300;border-color:var(--c);font-size:17px;padding:12px 22px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a{color:var(--c)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(3vw,12px) 6px;font:600 16px "Familjen Grotesk",sans-serif}
.hud a{color:var(--ink);text-decoration:none}
.hud .row{flex-wrap:nowrap}
.pzb{min-height:40px;padding:6px 14px;background:var(--c);color:#1a1300;border-color:var(--c);font-size:16px}
.stage{position:relative;flex:1;min-height:180px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dock{padding:8px max(3vw,10px) max(10px,env(safe-area-inset-bottom));background:#0b130e;border-top:1px solid var(--line)}
.dock .in{max-width:900px;margin:0 auto}
.qk{font:700 13px "Familjen Grotesk",sans-serif;color:var(--c);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.qt{font:700 clamp(26px,6.2vw,42px)/1.15 "Familjen Grotesk",sans-serif;text-align:center;text-wrap:balance;margin:2px 0 8px}
.qt.long{font-size:clamp(20px,4.6vw,30px)}
.qt .flag{height:clamp(64px,13vh,120px);border-radius:8px;box-shadow:0 4px 18px #0008;display:block;margin:4px auto 0;background:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:700 clamp(18px,4.3vw,26px)/1.2 "Familjen Grotesk",sans-serif;background:var(--panel);border:3px solid var(--lc);border-radius:14px;padding:10px;min-height:64px;cursor:pointer;color:var(--ink);text-wrap:balance}
.opt.long{font-size:clamp(14px,3.3vw,19px)}
.opt.ok{background:var(--ok);border-color:var(--ok)}.opt.bad{background:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:.85}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--bad);color:#fff;font:700 clamp(20px,4.5vw,28px) "Familjen Grotesk",sans-serif;padding:10px 18px;border-radius:12px;max-width:92%;text-align:center;display:none;z-index:2}
.toast.ok{background:var(--ok)}
.cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:800 140px "Familjen Grotesk",sans-serif;color:var(--c);z-index:3;pointer-events:none;text-shadow:0 4px 20px #000}
.pov{position:absolute;inset:0;background:#0b130ecc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:4}.pov.on{display:flex}.pov h2{margin:0;font:700 40px "Familjen Grotesk",sans-serif}.pov button{font-size:22px;padding:16px 34px;min-height:64px}
.ov{position:fixed;inset:0;background:#0b130ef5;overflow:auto;display:none;padding:22px max(4vw,16px) 40px;z-index:5}
.ov.on{display:block}
.box{max-width:700px;margin:0 auto;display:grid;gap:12px}
.box h1{font-size:clamp(30px,6vw,42px);margin:0;line-height:1.1}.box h2{font-size:21px;margin:8px 0 0}
.box p{margin:0;color:#d5e2d6}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font:700 13px "Familjen Grotesk",sans-serif;color:var(--muted);width:100%;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.race{background:#ffbe0b18;border:1px solid var(--c);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.code{font:800 38px "Familjen Grotesk",sans-serif;letter-spacing:.18em;color:var(--c)}
.rank{display:grid;gap:6px}.rank div{display:flex;justify-content:space-between;background:var(--panel);border-radius:10px;padding:8px 12px;font:600 17px "Familjen Grotesk",sans-serif}
.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px}.rv .m{color:var(--muted);font-size:15px}
.lang{display:flex;gap:6px}.lang button{min-height:34px;padding:5px 10px;font-size:13px;border-radius:999px}
.muted{color:var(--muted)}
</style>
</head>

<div id="app">
 <div class="hud"><a href="../" id="back">← All games</a><span id="prog" class="g"></span>
  <div class="row" style="gap:6px"><button id="mu" aria-label="Music" style="min-height:36px;padding:4px 10px">🎵</button><button id="vc" aria-label="Voice" style="min-height:36px;padding:4px 10px">🔊</button><button id="pz" class="pzb">⏸ Pause</button></div></div>

  mode:"Contre qui grimpez-vous ?",bots:"Singes de l'ordinateur",room:"Amis en ligne",level:"Niveau de l'ordinateur",easy:"Facile",mid:"Moyen",hard:"Difficile",

  players:"Joueurs dans la salle",go:"Lancer la grimpe",hostwait:"En attente de l'hôte…",leave:"Quitter la salle",again:"Regrimper",menu:"Changer de jeu",

  top:"Sommet atteint !",rank:"Classement",climbing:"grimpe encore",rev:"Revoir vos erreurs",none:"Aucune erreur. Grimpe parfaite.",you:"votre choix",branch:"Branche",
  paused:"Pause",play:"Jouer",pause:"Pause",all:"← Tous les jeux",xp:"XP",lvl:"Niveau",learn:"Apprendre d'abord",keys:"Les touches 1 2 3 4 répondent aussi."},
 de:{title:"Monkey Climb",lead:"Klettern Sie mit Ihrem Affen auf den Baum. Auf jedem Ast wartet eine Frage: richtig, und Sie steigen auf; falsch, und Sie rutschen einen Ast ab. Wer zuerst oben ist, gewinnt.",
  mode:"Gegen wen klettern Sie?",bots:"Computer-Affen",room:"Freunde online",level:"Computer-Stufe",easy:"Leicht",mid:"Mittel",hard:"Schwer",

  players:"Spieler im Raum",go:"Klettern starten",hostwait:"Warten auf den Gastgeber…",leave:"Raum verlassen",again:"Nochmal klettern",menu:"Spiel wechseln",
  conn:"Verbinde…",fail:"Keine Verbindung. Code prüfen und ob die Seite des Gastgebers noch offen ist.",won:"Sie waren zuerst oben!",place:n=>"Sie sind "+n+". geworden",
  top:"Gipfel erreicht!",rank:"Rangliste",climbing:"klettert noch",rev:"Ihre Fehler",none:"Keine Fehler. Perfekt geklettert.",you:"Ihre Wahl",branch:"Ast",
  paused:"Pause",play:"Weiter",pause:"Pause",all:"← Alle Spiele",xp:"XP",lvl:"Stufe",learn:"Erst lernen",keys:"Die Tasten 1 2 3 4 antworten auch."}};
let ct=CS[UI];
const MCOL=["#ffbe0b","#4cc9f0","#f15bb5","#9b5de5","#00f5d4","#fb5607","#8ac926","#ff99c8"];
cfg=Object.assign({pack:"mix",lang:UI,to:UI==="en"?"fr":"en",cont:"",n:15,bot:1,who:"bots"},JSON.parse(localStorage.getItem("mc-cfg")||"{}"));cfg.lanes=4;
if(hp&&S.en.P[hp])cfg.pack=hp;
const saveCfg=()=>{try{localStorage.setItem("mc-cfg",JSON.stringify(cfg))}catch(e){}};
let myName="";try{myName=localStorage.getItem("lr-name")||""}catch(e){}
let voiceOn=true;try{voiceOn=localStorage.getItem("lr-voice")!=="0"}catch(e){}
function say(q){if(!voiceOn||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const lang=q.sl||cfg.lang;
 const parts=[[q.k.replace(/\s*\(.*\)$/,""),UI],[(q.q||"").replace(/[“”?]/g,"").trim(),lang]].filter(x=>x[0]);
 for(const [txt,l] of parts){const u=new SpeechSynthesisUtterance(txt);const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(l));if(vs.length)u.voice=vs.find(v=>/natural|google|premium|enhanced/i.test(v.name))||vs[0];u.lang={en:"en-GB",fr:"fr-FR",de:"de-DE",pt:"pt-PT"}[l]||l;speechSynthesis.speak(u)}}catch(e){}}
const cv=$("#cv"),cx=cv.getContext("2d");let W=0,Hh=0;
function size(){const r=$("#stage").getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;Hh=r.height;cv.width=W*d;cv.height=Hh*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",size);
let G=null,seq=[];
function makeSeq(sd){seed=sd;rnd=mulberry(sd);lastQ=[];seq=[];for(let i=0;i<cfg.n*4+20;i++)seq.push(nextQ())}
function newGame(sd,others){makeSeq(sd);
 const me={id:"me",name:myName||"Me",col:MCOL[0],b:0,y:0,fin:0,me:1};
 G={me,mons:[me],qi:0,lock:false,state:"run",t0:performance.now(),mist:[],wait:0,camY:0,parts:[]};
 if(cfg.who==="bots"){const acc=[.62,.78,.9][cfg.bot],sp=[[4.5,8],[3.2,6],[2.2,4.2]][cfg.bot];
  ["Kiki","Bongo","Mira"].forEach((n,i)=>G.mons.push({id:"bot"+i,name:n,col:MCOL[i+1],b:0,y:0,fin:0,bot:{acc:acc-.04*i,sp,next:sp[0]+Math.random()*(sp[1]-sp[0])}}))}
 $("#menu").classList.remove("on");$("#over").classList.remove("on");$("#pov").classList.remove("on");$("#pz").style.display=cfg.who==="room"?"none":"";size();SFX.music("quiz");showQ();prog()}
function showQ(){const q=seq[G.qi%seq.length],n=q.lanes.length,long=q.long||Math.max(...q.lanes.map(s=>s.length))>30;G.lock=false;
 $("#qk").textContent=q.k+" · "+ct.branch+" "+(G.me.b+1)+"/"+cfg.n;$("#qt").innerHTML=q.img?`<img class="flag" src="${q.img}" alt="">`:esc(q.q);$("#qt").classList.toggle("long",(q.q||"").length>40);
 $("#opts").innerHTML=q.lanes.map((s,i)=>`<button class="opt${long?" long":""}" style="--lc:${["#2b8cc4","#9b5de5","#e0568f","#2a9d8f"][i]}" data-i="${i}">${esc(s)}</button>`).join("");say(q)}
function answer(i){if(!G||G.state!=="run"||G.lock)return;const q=seq[G.qi%seq.length],ok=i===q.right,me=G.me;G.lock=true;
 document.querySelectorAll(".opt").forEach((e,j)=>{e.disabled=true;if(j===q.right)e.classList.add("ok");else if(j===i)e.classList.add("bad")});
 if(ok){me.b++;SFX.ok();burst(me)}else{me.b=Math.max(0,me.b-1);SFX.bad();BANK.add({game:"climb",lang:q.sl||cfg.lang,q:q.k+": "+(q.q||""),img:q.img,a:q.ans,note:q.note});G.mist.push({k:q.k,q:q.q||q.note,img:q.img,a:q.ans,y:q.lanes[i],n:q.note});toast("✓ "+q.ans)}
 G.qi++;if(me.b>=cfg.n&&!me.fin){me.fin=performance.now()-G.t0;SFX.win();toast(ct.top,1)}
 sync();prog();G.wait=ok?.45:1.6}
function burst(m){for(let i=0;i<18;i++)G.parts.push({x:monX(m),y:branchY(m.b),vx:(Math.random()-.5)*220,vy:-Math.random()*240-40,life:.8,col:["#ffbe0b","#8ac926","#fff"][i%3]})}
function toast(s,ok){const e=$("#toast");e.textContent=s;e.className="toast"+(ok?" ok":"");e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",ok?900:1700)}
function prog(){if(!G)return;$("#prog").textContent="🐒 "+G.me.b+"/"+cfg.n}
function sorted(){return G.mons.slice().sort((a,b)=>(a.fin&&b.fin)?a.fin-b.fin:a.fin?-1:b.fin?1:b.b-a.b)}
// ---------- drawing ----------
const GAP=()=>Math.max(80,Math.min(120,Hh/4.2));
function branchY(b){return Hh-70-b*GAP()+G.camY}
function monX(m){const i=G.mons.indexOf(m),side=(m.b%2?1:-1);return W/2+side*(52+((i%4)*34))}
function draw(dt){const g=cx.createLinearGradient(0,0,0,Hh);g.addColorStop(0,"#5ec2ff");g.addColorStop(.6,"#b8f2c8");g.addColorStop(1,"#3d8b4f");cx.fillStyle=g;cx.fillRect(0,0,W,Hh);
 if(!G)return;const top=cfg.n,gp=GAP();
 const want=Math.max(0,G.me.y*gp-Hh*.45);G.camY+=(want-G.camY)*Math.min(1,dt*4);
 // background jungle
 cx.fillStyle="#2f7d4f55";for(let i=0;i<8;i++){const x=(i/7)*W,y=Hh*.5+((i*97)%60)+G.camY*.2;cx.beginPath();cx.arc(x,y,70,0,7);cx.fill()}
 // trunk
 const yb=branchY(-0.4),yt=branchY(top+.6);cx.fillStyle="#7f5539";cx.fillRect(W/2-22,yt,44,yb-yt+200);cx.fillStyle="#6b4428";for(let y=yt;y<yb+200;y+=26)cx.fillRect(W/2-14+((y/26)%2)*10,y,8,12);
 // branches
 for(let b=0;b<=top;b++){const y=branchY(b);if(y<-60||y>Hh+60)continue;const side=b%2?1:-1,len=Math.min(W*.42,230);
  cx.strokeStyle="#7f5539";cx.lineWidth=12;cx.lineCap="round";cx.beginPath();cx.moveTo(W/2,y+8);cx.quadraticCurveTo(W/2+side*len*.5,y+14,W/2+side*len,y);cx.stroke();
  cx.fillStyle=b%3?"#40916c":"#2d6a4f";for(let k=0;k<3;k++){cx.beginPath();cx.arc(W/2+side*(len-10-k*28),y-10-(k%2)*8,18,0,7);cx.fill()}
  cx.fillStyle="#ffffffcc";cx.font='700 13px "Familjen Grotesk",sans-serif';cx.textAlign="center";cx.fillText(b===top?"🏁":String(b),W/2,y+4)}
 // crown/bananas at the top
 const ty=branchY(top)-46;if(ty>-80){cx.font="40px serif";cx.textAlign="center";cx.fillText("🍌",W/2,ty)}
 for(const m of G.mons){m.y+=(m.b-m.y)*Math.min(1,dt*7);drawMonkey(m)}
 for(const p of G.parts){p.life-=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.globalAlpha=Math.max(0,p.life/.8);cx.fillStyle=p.col;cx.fillRect(p.x-3,p.y-3,6,6)}cx.globalAlpha=1;G.parts=G.parts.filter(p=>p.life>0)}
function drawMonkey(m){const i=G.mons.indexOf(m),b=m.y,side=(Math.round(b)%2?1:-1),x=W/2+side*(52+((i%4)*34)),y=Hh-70-b*GAP()+G.camY-24;if(y<-60||y>Hh+60)return;
 const sw=Math.sin(performance.now()/300+i)*3;cx.save();cx.translate(x,y+sw);
 cx.strokeStyle="#6f4518";cx.lineWidth=4;cx.beginPath();cx.moveTo(-10,10);cx.quadraticCurveTo(-26,20,-20,-2);cx.stroke();
 cx.fillStyle="#8b5a2b";cx.beginPath();cx.ellipse(0,8,13,15,0,0,7);cx.fill();
 cx.beginPath();cx.arc(0,-12,13,0,7);cx.fill();cx.beginPath();cx.arc(-13,-14,6,0,7);cx.arc(13,-14,6,0,7);cx.fill();
 cx.fillStyle="#f1d1a5";cx.beginPath();cx.ellipse(0,-9,9,8,0,0,7);cx.fill();cx.beginPath();cx.ellipse(0,9,8,9,0,0,7);cx.fill();
 cx.fillStyle="#1b1b1b";cx.beginPath();cx.arc(-4,-13,2,0,7);cx.arc(4,-13,2,0,7);cx.fill();cx.strokeStyle="#1b1b1b";cx.lineWidth=1.5;cx.beginPath();cx.arc(0,-8,3.5,.2,Math.PI-.2);cx.stroke();
 cx.fillStyle=m.col;cx.fillRect(-12,-28,24,6);// headband in player colour
 cx.strokeStyle="#8b5a2b";cx.lineWidth=5;cx.beginPath();cx.moveTo(8,0);cx.lineTo(16,-16);cx.moveTo(-8,0);cx.lineTo(-14,-14);cx.stroke();
 cx.restore();
 cx.font='700 13px "Familjen Grotesk",sans-serif';cx.textAlign="center";const lbl=m.name+(m.fin?" 🏆":"");const w=cx.measureText(lbl).width+12;
 cx.fillStyle=m.me?"#ffbe0b":"#000000aa";cx.fillRect(x-w/2,y-52,w,18);cx.fillStyle=m.me?"#1a1300":"#fff";cx.fillText(lbl,x,y-39)}
// ---------- loop ----------
let raf=0,last=0;
function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!W)size();
 if(G&&G.state==="run"){
  for(const m of G.mons)if(m.bot&&!m.fin){m.bot.next-=dt;if(m.bot.next<=0){const r=Math.random()<m.bot.acc;m.b=r?m.b+1:Math.max(0,m.b-1);m.bot.next=m.bot.sp[0]+Math.random()*(m.bot.sp[1]-m.bot.sp[0]);if(m.b>=cfg.n)m.fin=performance.now()-G.t0}}
  if(G.lock){G.wait-=dt;if(G.wait<=0){if(G.me.fin||(cfg.who==="bots"&&G.mons.some(m=>m.fin)&&!G.me.fin&&G.mons.filter(m=>m.fin).length>=G.mons.length-1))return end();showQ()}}
  if(cfg.who==="bots"&&G.mons.filter(m=>m.bot&&m.fin).length===G.mons.length-1&&!G.me.fin&&!G.lock)return end();}
 draw(G&&G.state==="pause"?0:dt)}
function end(){G.state="over";cancelAnimationFrame(raf);raf=0;SFX.stop();
 const order=sorted(),place=order.indexOf(G.me)+1;const xi=XP.add(G.me.b*4+(place===1&&G.me.fin?30:0),"climb");
 if(place===1&&G.me.fin)SFX.win();else SFX.over();sync();
 $("#over").innerHTML=`<div class="box"><h1>${place===1&&G.me.fin?ct.won:ct.place(place)}</h1>
  <div class="race"><b>${ct.rank}</b><div class="rank" id="rank"></div></div>
  <div class="race"><b>+${xi.gained||0} ${ct.xp}${xi.up?" · "+ct.lvl+" "+xi.level+" !":""}</b><span class="muted">${ct.lvl} ${xi.level}${xi.streak?" · 🔥 "+xi.streak:""}</span></div>
  <div class="row">${cfg.who==="room"?(R.host?`<button class="pri" id="rag">${ct.again}</button>`:`<span class="muted">${ct.hostwait}</span>`)+`<button id="mn">${ct.leave}</button>`:`<button class="pri" id="ag">${ct.again}</button><button id="mn">${ct.menu}</button>`}<a href="../learn/#${HUB[cfg.pack]||"capitals"}">${ct.learn}</a></div>
  <h2>${ct.rev}</h2>${G.mist.length?G.mist.map(m=>`<div class="rv"><div class="m">${esc(m.k)}</div>${m.img?`<img src="${m.img}" alt="" style="height:28px;vertical-align:middle;margin-right:6px">`:""}<b>${esc(m.q)}</b> → <b style="color:#5fd39a">${esc(m.a)}</b><div class="m">${ct.you}: <s>${esc(m.y)}</s></div></div>`).join(""):`<p>${ct.none}</p>`}</div>`;
 $("#over").classList.add("on");rank();
 const ag=$("#ag");if(ag)ag.onclick=()=>newGame((Math.random()*1e9)>>>0);const rag=$("#rag");if(rag)rag.onclick=()=>R.start();
 $("#mn").onclick=()=>{if(cfg.who==="room")R.leave();menu()}}
function rank(){const e=$("#rank");if(!e||!G)return;const o=cfg.who==="room"?R.mons():sorted();
 e.innerHTML=o.map((m,i)=>`<div><span>${i+1}. ${esc(m.name)}${m.me?" ★":""}</span><span>${m.fin?"🏆 "+(m.fin/1000).toFixed(1)+" s":m.b+"/"+cfg.n+" · "+ct.climbing}</span></div>`).join("")}
// ---------- online room ----------
const R={room:null,host:false,code:"",go:0,list:[],status:"",sent:"",
 others(){return this.list.filter(x=>!x.isMe).map(x=>x.presence).filter(p=>p&&p.n)},
 hostP(){const h=this.list.find(x=>x.presence&&x.presence.h);return h?h.presence:null},
 mons(){const a=this.others().filter(p=>p.go===this.go).map(p=>({name:p.n,b:p.b||0,fin:p.f||0}));if(G)a.push(G.me);return a.sort((a,b)=>(a.fin&&b.fin)?a.fin-b.fin:a.fin?-1:b.fin?1:b.b-a.b)},
 async open(asHost,code){if(!myName){toast(ct.yname);return}try{localStorage.setItem("lr-name",myName)}catch(e){}
  this.host=asHost;this.code=asHost?[...Array(4)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join(""):String(code||"").toUpperCase().replace(/[^A-Z]/g,"");
  if(!this.code)return;this.status=ct.conn;menu();
  try{this.room=await TWROOM.join("mc-"+this.code.toLowerCase(),asHost)}catch(e){this.room=null;this.status=ct.fail;menu();return}
  this.status="";const p={n:myName.slice(0,24),b:0,f:0,go:0};if(asHost)Object.assign(p,{h:1,cfg,seed:0});await this.room.presence(p);
  this.room.onPeers(ch=>{this.list=ch.peers;this.onList()});menu()},
 onList(){const h=this.hostP();
  if(!this.host&&h&&h.go&&h.go!==this.go){this.go=h.go;Object.assign(cfg,h.cfg,{who:"room",lanes:4});this.countdown(h.seed);return}
  if(G&&G.state==="run")this.syncOthers();else if(G&&G.state==="over")rank();else if($("#menu").classList.contains("on"))this.lobby()},
 syncOthers(){if(!G)return;const ps=this.others().filter(p=>p.go===this.go);
  ps.forEach((p,i)=>{let m=G.mons.find(x=>x.id===p.n+"#"+i);if(!m){m={id:p.n+"#"+i,name:p.n,col:MCOL[(G.mons.length)%MCOL.length],b:0,y:0,fin:0};G.mons.push(m)}m.b=p.b||0;m.fin=p.f||0})},
 start(){if(!this.host)return;this.go=(this.go||0)+1;const sd=(Math.random()*1e9)>>>0;this.sent="";this.room.presence({cfg,seed:sd,go:this.go,b:0,f:0});this.countdown(sd)},
 countdown(sd){$("#menu").classList.remove("on");$("#over").classList.remove("on");const cd=$("#cd");cd.style.display="flex";let n=3;
  const tick=()=>{if(n>0){SFX.tick();cd.textContent=n;n--;setTimeout(tick,800)}else{cd.style.display="none";newGame(sd);this.syncOthers()}};tick()},
 lobby(){const e=$("#lobby");if(!e)return;e.innerHTML=this.list.map(x=>x.presence).filter(p=>p&&p.n).map(p=>`<div><span>🐒 ${esc(p.n)}${p.h?" ★":""}</span></div>`).join("")},
 leave(){try{this.room&&this.room.leave()}catch(e){}this.room=null;this.list=[];this.go=0;this.code=""}};
function sync(){if(cfg.who!=="room"||!R.room||!G)return;const pr={b:G.me.b,f:Math.round(G.me.fin),go:R.go},js=JSON.stringify(pr);if(js!==R.sent){R.sent=js;R.room.presence(pr)}}
// ---------- menu ----------
function menu(){SFX.stop();if(G&&G.state!=="over")G.state="menu";$("#pov").classList.remove("on");
 const P=["mix","capitals","flags","flags_cap","vocab","idioms","meaning","falsefr","acronyms","register","capitals_rev"],needTo=["idioms","vocab","mix"].includes(cfg.pack),cap=/^(capitals|flags)/.test(cfg.pack)||cfg.pack==="mix";
 const b=(k,v,lab)=>`<button data-k="${k}" data-v="${v}" aria-pressed="${String(cfg[k])===String(v)}">${lab}</button>`;
 const guest=cfg.who==="room"&&R.room&&!R.host,xi=XP.info();
 const settings=guest?"":`<div class="lbl">${t.pack}</div><div class="row">${P.map(p=>b("pack",p,t.P[p])).join("")}</div>
  <div class="lbl">${needTo?t.from:t.lang}</div><div class="row">${["en","fr","de","pt"].map(l=>b("lang",l,l.toUpperCase())).join("")}</div>
  ${needTo?`<div class="lbl">${t.to}</div><div class="row">${["en","fr","de","pt"].filter(l=>l!==cfg.lang).map(l=>b("to",l,l.toUpperCase())).join("")}</div>`:""}
  ${cap?`<div class="lbl">${t.cont}</div><div class="row">${b("cont","",t.world)}${Object.keys(C.CP.CONTINENTS).map(c=>b("cont",c,C.CP.CONTINENTS[c][UI])).join("")}</div>`:""}
  <div class="lbl">${ct.height}</div><div class="row">${[10,15,20,30].map(n=>b("n",n,n)).join("")}</div>`;
 let action;
 if(cfg.who==="bots")action=`<div class="lbl">${ct.level}</div><div class="row">${b("bot",0,ct.easy)}${b("bot",1,ct.mid)}${b("bot",2,ct.hard)}</div>
  <div class="row" style="margin-top:8px"><button class="pri" id="go">🐒 ${ct.start} →</button></div><p class="muted" style="font-size:15px">${ct.keys}</p>`;
 else action=!R.room?`<div class="race"><div class="lbl">${ct.yname}</div><input id="nm" maxlength="24" value="${esc(myName)}" autocomplete="nickname">
   <div class="row"><button class="pri" id="rc">${ct.create}</button></div><div class="lbl">${ct.code}</div><div class="row"><input id="rcode" maxlength="4" style="width:9em;text-transform:uppercase;letter-spacing:.15em" placeholder="ABCD"><button id="rj">${ct.join}</button></div>
   ${R.status?`<p>${esc(R.status)}</p>`:""}<p class="muted">${ct.share}</p></div>`
  :`<div class="race"><div class="lbl">${ct.code}</div><div class="code">${R.code}</div><p class="muted">${ct.share}</p><div class="lbl">${ct.players}</div><div class="rank" id="lobby"></div>
   <div class="row">${R.host?`<button class="pri" id="rs">${ct.go} →</button>`:`<span class="muted">${ct.hostwait}</span>`}<button id="rl">${ct.leave}</button></div></div>`;
 $("#menu").innerHTML=`<div class="box"><div class="row" style="justify-content:space-between"><a href="../" style="color:var(--ink);text-decoration:none;font:600 15px 'Familjen Grotesk',sans-serif">${ct.all}</a><div class="lang">${["en","fr","de"].map(l=>`<button data-ui="${l}" aria-pressed="${l===UI}">${l.toUpperCase()}</button>`).join("")}</div></div>
  <h1>🐒 ${ct.title}</h1><p>${ct.lead}</p><div class="muted" style="font:600 15px 'Familjen Grotesk',sans-serif">${ct.lvl} ${xi.level} · ${xi.xp} ${ct.xp}${xi.streak?" · 🔥 "+xi.streak:""}</div>
  <div class="lbl">${ct.mode}</div><div class="row">${b("who","bots","🤖 "+ct.bots)}${b("who","room","👥 "+ct.room)}</div>
  ${settings}${action}</div>`;
 $("#menu").classList.add("on");$("#over").classList.remove("on");
 const M_=$("#menu");
 M_.querySelectorAll("[data-k]").forEach(e=>e.onclick=()=>{const k=e.dataset.k;let v=e.dataset.v;if(k==="n"||k==="bot")v=+v;if(k==="who"&&v!=="room")R.leave();cfg[k]=v;if(cfg.to===cfg.lang)cfg.to=cfg.lang==="en"?"fr":"en";saveCfg();if(R.room&&R.host)R.room.presence({cfg});menu()});
 M_.querySelectorAll("[data-ui]").forEach(e=>e.onclick=()=>{UI=e.dataset.ui;t=S[UI];ct=CS[UI];try{localStorage.setItem("twb-ui",UI)}catch(x){}applyUI();menu()});
 const go=$("#go");if(go)go.onclick=()=>newGame((Math.random()*1e9)>>>0);
 const nm=$("#nm");if(nm)nm.oninput=()=>{myName=nm.value.trim()};
 const rc=$("#rc");if(rc)rc.onclick=()=>R.open(true);const rj=$("#rj");if(rj)rj.onclick=()=>R.open(false,$("#rcode").value);
 const rs=$("#rs");if(rs)rs.onclick=()=>R.start();const rl=$("#rl");if(rl)rl.onclick=()=>{R.leave();menu()};
 R.lobby();if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
function applyUI(){document.documentElement.lang=UI;$("#back").textContent=ct.all;$("#pz").textContent="⏸ "+ct.pause}
// ---------- input ----------
$("#opts").addEventListener("click",e=>{const o=e.target.closest(".opt");if(o)answer(+o.dataset.i)});
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(/^[1-4]$/.test(e.key))answer(+e.key-1);else if((e.key===" "||e.key==="Escape")&&G&&(G.state==="run"||G.state==="pause")&&cfg.who!=="room"){togglePause();e.preventDefault()}});
function togglePause(){if(G.state==="run"){G.state="pause";SFX.stop();$("#pz").textContent="▶ "+ct.play;$("#povh").textContent=ct.paused;$("#pres").textContent="▶ "+ct.play;$("#pmenu").textContent=ct.menu;$("#pov").classList.add("on")}
 else if(G.state==="pause"){G.state="run";SFX.music("quiz");$("#pz").textContent="⏸ "+ct.pause;$("#pov").classList.remove("on");last=performance.now()}}
$("#pz").onclick=()=>{if(G&&(G.state==="run"||G.state==="pause"))togglePause()};$("#pres").onclick=()=>{if(G&&G.state==="pause")togglePause()};$("#pmenu").onclick=()=>menu();
$("#mu").onclick=()=>{const v=!SFX.get("music");SFX.set("music",v);$("#mu").setAttribute("aria-pressed",v);if(v&&G&&G.state==="run")SFX.music("quiz")};
$("#vc").onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem("lr-voice",voiceOn?"1":"0")}catch(e){}$("#vc").textContent=voiceOn?"🔊":"🔇";if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel()};
$("#mu").setAttribute("aria-pressed",SFX.get("music"));$("#vc").textContent=voiceOn?"🔊":"🔇";
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G&&G.state==="run"&&cfg.who!=="room")togglePause()});
applyUI();size();menu();
</script>
