<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Number Avalanche · Interpreter Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../live/shell.css">
<style>
:root{--c:#3ec5ff;--bg:#0d1830}
.num{font-weight:800;font-size:clamp(40px,11vw,84px);text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.words{font-size:clamp(18px,4vw,24px);text-align:center;color:#dfe9ff}
#ans{width:100%;text-align:center;font-size:clamp(28px,7vw,44px);font-weight:800;letter-spacing:.04em}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-30px;color:#ffffff22;font-weight:800;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.wrap{position:relative;z-index:1}
.mic{font-size:28px;min-height:72px;min-width:72px;border-radius:50%}
.mic.on{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px #ef476f33}}
.share{white-space:pre-wrap;background:#0008;border-radius:12px;padding:10px;font-family:ui-monospace,monospace;font-size:15px}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="wrap" id="game"></div>
<div class="ov on" id="menu"></div><div class="ov" id="over"></div>
<script src="../live/sfx.js"></script>
<script src="../live/xp.js"></script>
<script src="../live/shell.js"></script>
<script src="../live/numwords.js"></script>
<script>
"use strict";
const {$,esc}=SH;
const L10={
 en:{title:"Number Avalanche",lead:"Figures, years, percentages and millions fire at you. Hear (or read) each one and type the digits before the next one lands. The game speeds up while you stay near 80% right.",
  lang:"Language you hear",mode:"Mode",listen:"🔊 Listen and type",read:"📖 Read the words, type the digits",say:"🎤 See digits, say them",time:"Round",daily:"📅 Daily challenge",dailyT:d=>`Today: 20 numbers in ${d}. Same numbers for everyone.`,
  done:"Daily challenge done",type:"Type the digits, then Enter",check:"Check",skip:"Skip",replay:"🔁 Hear again",said:"I said it right",missed:"I missed it",
  over:"Round over",acc:"Accuracy",avg:"Average time",correct:"Numbers right",copy:"Copy my result",copied:"Copied. Paste it in your group chat.",
  noSR:"Speech recognition is not available in this browser. Say it aloud, then check yourself.",lv:"Level",
  V:{en:"English",fr:"French (France)",frbe:"French (Belgium)",frch:"French (Switzerland)",de:"German",pt:"Portuguese (Portugal)",ptbr:"Portuguese (Brazil)"}},
 fr:{title:"Number Avalanche",lead:"Chiffres, années, pourcentages et millions vous tombent dessus. Écoutez (ou lisez) chacun et tapez les chiffres avant le suivant. Le jeu accélère tant que vous restez vers 80 % de réussite.",
  lang:"Langue entendue",mode:"Mode",listen:"🔊 Écouter et taper",read:"📖 Lire les mots, taper les chiffres",say:"🎤 Voir les chiffres, les dire",time:"Manche",daily:"📅 Défi du jour",dailyT:d=>`Aujourd'hui : 20 nombres en ${d}. Les mêmes pour tout le monde.`,
  done:"Défi du jour terminé",type:"Tapez les chiffres puis Entrée",check:"Vérifier",skip:"Passer",replay:"🔁 Réécouter",said:"Je l'ai bien dit",missed:"Raté",
  over:"Manche terminée",acc:"Précision",avg:"Temps moyen",correct:"Nombres justes",copy:"Copier mon résultat",copied:"Copié. Collez-le dans votre groupe.",
  noSR:"La reconnaissance vocale n'existe pas dans ce navigateur. Dites-le à voix haute puis vérifiez-vous.",lv:"Niveau",
  V:{en:"anglais",fr:"français (France)",frbe:"français (Belgique)",frch:"français (Suisse)",de:"allemand",pt:"portugais (Portugal)",ptbr:"portugais (Brésil)"}},
 de:{title:"Number Avalanche",lead:"Zahlen, Jahreszahlen, Prozente und Millionen prasseln auf Sie ein. Hören (oder lesen) Sie jede und tippen Sie die Ziffern, bevor die nächste kommt. Das Spiel wird schneller, solange Sie bei etwa 80 % bleiben.",
  lang:"Gehörte Sprache",mode:"Modus",listen:"🔊 Hören und tippen",read:"📖 Wörter lesen, Ziffern tippen",say:"🎤 Ziffern sehen, aussprechen",time:"Runde",daily:"📅 Tages-Challenge",dailyT:d=>`Heute: 20 Zahlen auf ${d}. Für alle dieselben.`,
  done:"Tages-Challenge geschafft",type:"Ziffern tippen, dann Enter",check:"Prüfen",skip:"Weiter",replay:"🔁 Nochmal hören",said:"Richtig gesagt",missed:"Daneben",
  over:"Runde vorbei",acc:"Genauigkeit",avg:"Mittlere Zeit",correct:"Richtige Zahlen",copy:"Ergebnis kopieren",copied:"Kopiert. In die Gruppe einfügen.",
  noSR:"Spracherkennung gibt es in diesem Browser nicht. Laut sagen und selbst prüfen.",lv:"Stufe",
  V:{en:"Englisch",fr:"Französisch (Frankreich)",frbe:"Französisch (Belgien)",frch:"Französisch (Schweiz)",de:"Deutsch",pt:"Portugiesisch (Portugal)",ptbr:"Portugiesisch (Brasilien)"}}};
let t=L10[SH.UI];
const LANGS=["en","fr","frbe","frch","de","pt","ptbr"],FLAG={en:"🇬🇧",fr:"🇫🇷",frbe:"🇧🇪",frch:"🇨🇭",de:"🇩🇪",pt:"🇵🇹",ptbr:"🇧🇷"};
let cfg=Object.assign({lang:SH.UI==="fr"?"de":"fr",mode:"listen",time:180},JSON.parse(localStorage.getItem("na-cfg")||"{}"));
let G=null,rnd=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
// ---------- items by level ----------
function item(lv,L){const fr=L.startsWith("fr"),de=L==="de";let k=rnd(),n,kind="int",dig;
 const trap=()=>fr?R(70,99):de?R(21,99):R(13,99);
 if(lv<=1)n=k<.6?trap():R(0,99);
 else if(lv===2)n=k<.5?R(1,9)*100+trap():R(100,999);
 else if(lv===3){if(k<.4){kind="year";n=R(1890,2035)}else n=R(1000,9999)}
 else if(lv===4)n=k<.5?trap()*1000+R(0,999):R(10000,999999);
 else if(lv===5){if(k<.35){kind="pct";dig=(R(1,99)+(rnd()<.6?R(1,9)/10:0)).toFixed(rnd()<.6?1:0)}else if(k<.55){kind="dec";dig=(R(0,99)+R(1,99)/100).toFixed(2)}else n=R(100000,999999)}
 else{if(k<.3){kind="pct";dig=(R(1,99)+R(1,9)/10).toFixed(1)}else if(k<.5){kind="year";n=R(1100,2050)}else n=R(1,99)*(rnd()<.5?1e6:1e5)+(rnd()<.5?trap()*1000:R(0,999999))}
 if(dig==null)dig=String(n);
 const words=kind==="year"?NUMW.year(n,L):kind==="pct"?NUMW.pct(dig,L):kind==="dec"?NUMW.dec(dig,L):NUMW.int(n,L);
 return{kind,dig,words,show:kind==="pct"?fmt(dig,L)+" %":fmt(dig,L,kind==="year")}}
function fmt(d,L,year){const [a,b]=String(d).split(".");const sep=L==="en"?",":L.startsWith("fr")?" ":".";const ip=year?a:a.replace(/\B(?=(\d{3})+(?!\d))/g,sep);return b?ip+(L==="en"?".":",")+b:ip}
function norm(s){s=String(s).trim().replace(/[\s  ']/g,"").replace(/%|percent|pourcent|prozent|porcento/gi,"");
 const m=s.match(/^(\d+(?:[.,]\d{3})*)(?:[.,](\d{1,2}))?$/);if(!m)return s.replace(/[^\d]/g,"");return m[1].replace(/[.,]/g,"")+(m[2]?"."+m[2]:"")}
function same(a,b){a=norm(a);b=norm(b);if(a===b)return true;return parseFloat(a)===parseFloat(b)&&!isNaN(parseFloat(a))}
// ---------- play ----------
function start(daily){if(daily){const d=XP.day(),sd=+d.replace(/-/g,"");rnd=mulberry(sd*31);const rot=["de","fr","en","pt","frbe","de","ptbr","fr","frch"];G={daily:true,lang:rot[sd%rot.length],mode:"listen",total:20}}
 else{rnd=Math.random;G={daily:false,lang:cfg.lang,mode:cfg.mode,total:0}}
 Object.assign(G,{lv:G.daily?1:2,hist:[],score:0,streak:0,n:0,ok:0,miss:[],times:[],t0:performance.now(),tleft:cfg.time,item:null,state:"",grid:[]});
 $("#menu").classList.remove("on");$("#over").classList.remove("on");SH.state="run";SH.music="calm";SFX.music("calm");
 $("#game").innerHTML=SH.header()+`<div class="bar"><i id="tb"></i></div><div class="card" id="card"></div><div class="row muted" id="info"></div>`;
 SH.mount();next();tick.last=performance.now();requestAnimationFrame(tick)}
function next(){if(G.daily&&G.n>=G.total)return end();
 if(G.daily)G.lv=1+Math.floor(G.n/4);G.item=item(G.lv,G.lang);G.it0=performance.now();G.limit=Math.max(4,(G.mode==="say"?11:10)-G.lv*.7)+(G.item.words.length/18);G.state="ask";draw();
 if(G.mode==="listen")speak()}
function rate(){return Math.min(1.5,.92+G.lv*.06)}
function speak(){try{speechSynthesis.cancel()}catch(e){}SH.say(G.item.words,SH.LOC[G.lang],rate())}
function draw(){const it=G.item;$("#sh-st").innerHTML=`<span>${t.lv} ${G.lv}</span><span>${SH.t.score} ${G.score}</span>${G.streak>=5?`<span style="color:#ffd166">×${1+Math.floor(G.streak/5)}</span>`:""}<span>${FLAG[G.lang]}</span>${G.daily?`<span>${G.n+1}/20</span>`:""}`;
 const c=$("#card");
 if(G.mode==="listen")c.innerHTML=`<div class="mid">🔊</div><input id="ans" inputmode="decimal" autocomplete="off" placeholder="…"><div class="row" style="justify-content:center"><button class="pri" id="ck">${t.check}</button><button id="rp">${t.replay}</button><button id="sk">${t.skip}</button></div><div class="muted" style="text-align:center">${t.type}</div>`;
 else if(G.mode==="read")c.innerHTML=`<div class="words pop" style="font-size:clamp(22px,5vw,32px);font-weight:700">${esc(it.words)}</div><input id="ans" inputmode="decimal" autocomplete="off" placeholder="…"><div class="row" style="justify-content:center"><button class="pri" id="ck">${t.check}</button><button id="sk">${t.skip}</button></div>`;
 else c.innerHTML=`<div class="num pop">${esc(it.show)}</div><div class="row" style="justify-content:center">${SH.SR?`<button class="mic" id="mic">🎤</button>`:`<span class="muted">${t.noSR}</span>`}</div><div class="row" style="justify-content:center"><button id="sd" class="pri">${t.said}</button><button id="ms">${t.missed}</button></div><div id="heard" class="muted" style="text-align:center"></div>`;
 const a=$("#ans");if(a){a.focus();a.onkeydown=e=>{if(e.key==="Enter")check(a.value)};$("#ck").onclick=()=>check(a.value)}
 const rp=$("#rp");if(rp)rp.onclick=speak;const sk=$("#sk");if(sk)sk.onclick=()=>check("");
 const sd=$("#sd");if(sd){sd.onclick=()=>result(true,"");$("#ms").onclick=()=>result(false,"")}
 const mic=$("#mic");if(mic)mic.onclick=listen}
function listen(){const r=new SH.SR();r.lang=SH.LOC[G.lang];r.interimResults=false;r.maxAlternatives=5;const mic=$("#mic");mic.classList.add("on");
 r.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);$("#heard").textContent="“"+alts[0]+"”";const ok=alts.some(a=>same(a,G.item.dig)||norm(a)===norm(G.item.dig));result(ok,alts[0])};
 r.onerror=()=>mic.classList.remove("on");r.onend=()=>mic.classList.remove("on");try{r.start()}catch(e){}}
function check(v){if(G.state!=="ask")return;result(same(v,G.item.dig),v)}
function result(ok,given){if(G.state!=="ask")return;G.state="fb";const it=G.item,dt=(performance.now()-G.it0)/1000;G.n++;G.times.push(dt);G.hist.push(ok?1:0);
 if(ok){G.ok++;G.streak++;const m=1+Math.floor(G.streak/5);G.score+=Math.round((10+Math.max(0,G.limit-dt)*2)*m);G.streak%5===0?SFX.combo():SFX.ok()}
 else{G.streak=0;SFX.bad();G.miss.push({it,given});BANK.add({game:"numbers",lang:G.lang,q:"🔢 "+it.words,a:it.show})}
 // adaptive: keep success near 80%
 if(!G.daily&&G.hist.length>=4){const last=G.hist.slice(-5),acc=last.reduce((a,b)=>a+b,0)/last.length;if(acc>=.8&&G.lv<8){G.lv++;G.hist=[]}else if(acc<=.4&&G.lv>1){G.lv--;G.hist=[]}}
 G.grid.push(ok?"🟩":"🟥");
 $("#card").innerHTML=`<div class="num ${ok?"ok":"bad"} pop">${esc(it.show)}</div><div class="words">${esc(it.words)}</div>${!ok&&given?`<div class="fb bad" style="text-align:center">${esc(given)}</div>`:""}`;
 if(!ok)$("#card").classList.add("shake");setTimeout(()=>$("#card").classList.remove("shake"),400);
 G.fbUntil=performance.now()+(ok?700:2200)}
function tick(now){if(!G||SH.state==="menu"||SH.state==="over")return;requestAnimationFrame(tick);const dt=(now-tick.last)/1000;tick.last=now;if(SH.state!=="run")return;
 if(!G.daily){G.tleft-=dt;$("#tb").style.width=Math.max(0,G.tleft/cfg.time*100)+"%";if(G.tleft<=0&&G.state!=="fb")return end()}
 else $("#tb").style.width=(100-G.n/G.total*100)+"%";
 if(G.state==="ask"){const left=G.limit-(now-G.it0)/1000;$("#info").textContent="⏱ "+Math.max(0,left).toFixed(1)+" s";if(left<=0)result(false,"")}
 if(G.state==="fb"&&now>G.fbUntil){if(!G.daily&&G.tleft<=0)return end();next()}}
function end(){SH.state="over";SFX.stop();try{speechSynthesis.cancel()}catch(e){}const acc=G.n?Math.round(G.ok/G.n*100):0,avg=G.times.length?(G.times.reduce((a,b)=>a+b,0)/G.times.length).toFixed(1):"–";
 acc>=80?SFX.win():SFX.over();
 const xi=XP.add(G.score/6+G.ok,{lang:G.lang.slice(0,2),stats:{numOk:G.ok},metric:{numAcc:acc}});
 let share="";if(G.daily){const d=XP.day();try{localStorage.setItem("na-daily-"+d,JSON.stringify({ok:G.ok,score:G.score}))}catch(e){}
  share=`Number Avalanche ${d} ${FLAG[G.lang]}\n${G.ok}/20 · ${G.score} pts · ⏱ ${avg}s\n${G.grid.join("").replace(/(.{10})/gu,"$1\n")}\nhttps://vic-god.github.io/twister-booth/numbers/`}
 const bk=`numbers-best-${G.daily?"daily":cfg.lang+"-"+cfg.mode+"-"+cfg.time}`;let b=+(localStorage.getItem(bk)||0);if(G.score>b){localStorage.setItem(bk,G.score);b=G.score}
 $("#over").innerHTML=`<div class="box"><h1>${G.daily?t.done:t.over}</h1>
  <div class="row" style="gap:26px"><div><div class="lbl">${SH.t.score}</div><div class="big" style="color:var(--c);text-align:left">${G.score}</div></div><div><div class="lbl">${t.acc}</div><div class="big" style="text-align:left">${acc}%</div></div><div><div class="lbl">${t.avg}</div><div class="big" style="text-align:left">${avg}s</div></div></div>
  <p>${t.correct}: ${G.ok}/${G.n} · ${SH.t.best}: ${b}</p>${XP.strip(xi,SH.UI)}
  ${share?`<div class="share">${esc(share)}</div><button id="cp">📋 ${t.copy}</button>`:""}
  <div class="row"><button class="pri" id="ag">${SH.t.again}</button><button id="mn">${SH.t.change}</button><a href="../progress/">${SH.t.progress} →</a></div>
  <div class="lbl">${SH.t.review}</div>${G.miss.length?G.miss.map(m=>`<div class="rv"><b style="font-size:22px">${esc(m.it.show)}</b> · ${esc(m.it.words)}${m.given?`<div class="muted">${esc(m.given)}</div>`:""}</div>`).join("")+`<p class="muted">${SH.t.bank}</p>`:`<p>${SH.t.none}</p>`}</div>`;
 $("#over").classList.add("on");$("#ag").onclick=()=>start(G.daily&&false);$("#mn").onclick=menu;
 const cp=$("#cp");if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(share);SH.toast(t.copied,1)}catch(e){prompt("",share)}}}
function menu(){SH.state="menu";SFX.stop();t=L10[SH.UI];const d=XP.day(),rot=["de","fr","en","pt","frbe","de","ptbr","fr","frch"],dl=rot[(+d.replace(/-/g,""))%rot.length];
 const done=localStorage.getItem("na-daily-"+d);const o=(k,v,l)=>SH.opt(cfg,k,v,l);
 $("#menu").innerHTML=`<div class="box"><div class="row" style="justify-content:space-between"><a href="../" style="color:var(--ink);text-decoration:none;font-weight:600">${SH.t.all}</a>${SH.langBar()}</div>
  <h1>🔢 ${t.title}</h1><p>${t.lead}</p>
  <div class="card"><b>${t.daily}</b><span>${FLAG[dl]} ${t.dailyT(t.V[dl])}</span>${done?`<span class="ok">✅ ${JSON.parse(done).ok}/20</span>`:""}<div><button class="pri" id="dly">${t.daily} →</button></div></div>
  <div class="lbl">${t.lang}</div><div class="row">${LANGS.map(l=>o("lang",l,FLAG[l]+" "+t.V[l])).join("")}</div>
  <div class="lbl">${t.mode}</div><div class="row">${o("mode","listen",t.listen)}${o("mode","read",t.read)}${o("mode","say",t.say)}</div>
  <div class="lbl">${t.time}</div><div class="row">${o("time",60,"1 min")}${o("time",120,"2 min")}${o("time",180,"3 min")}</div>
  <div class="row" style="margin-top:8px"><button class="pri" id="go">▶ ${SH.t.start}</button></div></div>`;
 $("#menu").classList.add("on");$("#over").classList.remove("on");
 SH.bindOpts($("#menu"),cfg,"na-cfg",menu);SH.bindLang($("#menu"),menu);$("#go").onclick=()=>start(false);$("#dly").onclick=()=>start(true)}
SH.onMenu=menu;SH.onResume=()=>{G.it0=performance.now()-0;tick.last=performance.now()};
// falling-number background
(function(){const s=$("#snow");for(let i=0;i<22;i++){const e=document.createElement("i");e.textContent=Math.floor(Math.random()*1000);e.style.left=Math.random()*100+"%";e.style.fontSize=(14+Math.random()*30)+"px";e.style.animationDuration=(8+Math.random()*14)+"s";e.style.animationDelay=(-Math.random()*20)+"s";s.appendChild(e)}})();
document.documentElement.lang=SH.UI;menu();
</script>
</body>
</html>
