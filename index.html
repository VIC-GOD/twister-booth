<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interpreter Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{color-scheme:light dark;
 --bg:light-dark(#f3f1ec,#11141a);--panel:light-dark(#ffffff,#1a1f27);--ink:light-dark(#16202c,#e8ecf2);--muted:light-dark(#5b6675,#9aa6b4);--line:light-dark(#dcd8cf,#2b3440);
 --hero:light-dark(#16202c,#0b0e13);--accent:#f0a640;
 --c1:#4a2f7a;--c2:#1f5e8c;--c3:#2f7d4f;--c4:#b8432f;--c5:#a77a12;--c6:#5b6675}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Serif 4",Georgia,serif}
h1,h2,h3{font-family:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
a{color:inherit}
.hero{background:var(--hero);color:#fff;padding:clamp(28px,5vw,56px) max(5vw,16px) clamp(32px,5vw,60px)}
.hero .in{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.hero h1{font-size:clamp(34px,6vw,56px)}
.hero p{max-width:60ch;color:#c9d2dd}
.wave{width:150px;height:40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lang{display:flex;gap:6px}
.lang button{font:600 14px "Familjen Grotesk",sans-serif;background:transparent;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.lang button[aria-pressed=true]{background:#fff;color:#16202c}
main{max-width:1100px;margin:0 auto;padding:28px max(4vw,16px) 64px;display:grid;gap:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.band{height:10px;background:var(--c)}
.gb{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.game h2{font-size:26px}
.game p{margin:0;color:var(--muted);font-size:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 12.5px "Familjen Grotesk",sans-serif;border-radius:999px;padding:3px 9px;background:color-mix(in srgb,var(--c) 14%,transparent);color:light-dark(var(--c),#fff)}
.play{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.play a{font:600 15px "Familjen Grotesk",sans-serif;text-decoration:none;border-radius:10px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--line)}
.play a.main{background:var(--c);border-color:var(--c);color:#fff}
.play a:hover{border-color:var(--c)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font:600 14.5px "Familjen Grotesk",sans-serif;color:var(--muted);min-height:32px;display:flex;align-items:center}
details ul{margin:8px 0 0;padding-left:18px;font-size:15px}
details li{margin:3px 0}
.friends{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:10px}
.friends h2{font-size:24px}
.friends ol{margin:0;padding-left:20px}
.foot{color:var(--muted);font-size:14.5px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="hero"><div class="in">
 <div class="top">
  <svg class="wave" viewBox="0 0 120 32" aria-hidden="true"><path d="M2 16 Q12 2 22 16 T42 16 T62 16 T82 16 T102 16 T118 16" fill="none" stroke="#f0a640" stroke-width="4" stroke-linecap="round"/></svg>
  <div class="lang" role="group" aria-label="Language">
   <button data-l="en">English</button><button data-l="fr">Français</button><button data-l="de">Deutsch</button>
  </div>
 </div>
 <h1 id="t-title">Interpreter Games</h1>
 <p id="t-lead"></p>
</div></header>
<main>
 <section class="grid" id="games"></section>
 <section class="friends">
  <h2 id="t-fh"></h2>
  <ol id="t-fl"></ol>
 </section>
 <section class="friends">
  <h2 id="t-ph"></h2>
  <p class="foot" id="t-pt"></p>
  <ul id="plan"></ul>
 </section>
 <p class="foot" id="t-foot"></p>
</main>
<script>
{
const T={
en:{lead:"Training games for interpreters and public speakers in English, French, German and sign language. Play in the browser on any phone or laptop, no account needed, or print the cards.",
 play:"Play",all:"All languages",print:"Printable cards (PDF)",
 fh:"Play with friends",fl:["Open <b>Twister Booth</b> and go to <b>Live room</b>. Type your name and create a room.","Read the 4-letter code out to your friends. They open this same site on their own phones and join with it.","Everyone gets the same card each round, and the scoreboard updates live.","On one device, use the Duel or Party modes inside each game."],
 ph:"Plan your training",pt:"A level test and a 12-week plan to work through the games in order.",
 foot:"Progress is saved in your own browser only. Print the card PDFs on A4, double-sided, flip on the long edge, at 100%.",
 g:{tw:["Tongue twisters for diction, articulation and speed: warm-up routine, speed runs, ladder, split attention, live rooms."],
    id:["Idioms, expressions and press language: meaning, register, rephrasing drills and duels."],
    bg:["Booth drills: acronyms, timed speeches, dilemmas and register ladders."],
    cr:["World capitals relay: learn every country and capital in all your languages."],
    tp:["Impromptu speaking: draw a topic card and speak for a set time."]}},
fr:{lead:"Des jeux d'entraînement pour interprètes et orateurs, en anglais, français, allemand et langue des signes. Jouez dans le navigateur sur n'importe quel téléphone ou ordinateur, sans compte, ou imprimez les cartes.",
 play:"Jouer",all:"Toutes les langues",print:"Cartes à imprimer (PDF)",
 fh:"Jouer entre amis",fl:["Ouvrez <b>Twister Booth</b> et allez dans <b>Live room</b>. Tapez votre prénom et créez une salle.","Lisez le code de 4 lettres à vos amis. Ils ouvrent ce même site sur leur téléphone et rejoignent la salle avec ce code.","Tout le monde reçoit la même carte à chaque manche, et le classement se met à jour en direct.","Sur un seul appareil, utilisez les modes Duel ou Fête de chaque jeu."],
 ph:"Planifier votre entraînement",pt:"Un test de niveau et un plan sur 12 semaines pour enchaîner les jeux dans l'ordre.",
 foot:"La progression est enregistrée uniquement dans votre navigateur. Imprimez les PDF en A4, recto verso, retournement bord long, à 100 %.",
 g:{tw:["Virelangues pour la diction, l'articulation et le débit : échauffement, contre la montre, échelle, attention partagée, salles en direct."],
    id:["Expressions idiomatiques et langue de presse : sens, registre, reformulation et duels."],
    bg:["Exercices de cabine : sigles, discours chronométrés, dilemmes et échelles de registre."],
    cr:["Relais des capitales : chaque pays et sa capitale dans toutes vos langues."],
    tp:["Prise de parole improvisée : tirez un sujet et parlez pendant un temps donné."]}},
de:{lead:"Trainingsspiele für Dolmetscher und Redner auf Englisch, Französisch, Deutsch und in Gebärdensprache. Im Browser auf jedem Handy oder Laptop spielen, ohne Konto, oder die Karten drucken.",
 play:"Spielen",all:"Alle Sprachen",print:"Karten zum Drucken (PDF)",
 fh:"Mit Freunden spielen",fl:["<b>Twister Booth</b> öffnen und zu <b>Live room</b> gehen. Namen eingeben und einen Raum eröffnen.","Den vierstelligen Code vorlesen. Die anderen öffnen diese Seite auf dem eigenen Handy und treten damit bei.","Alle bekommen pro Runde dieselbe Karte, die Rangliste aktualisiert sich live.","Auf einem Gerät: die Duell- oder Party-Modi in jedem Spiel."],
 ph:"Training planen",pt:"Ein Einstufungstest und ein 12-Wochen-Plan, um die Spiele der Reihe nach durchzuarbeiten.",
 foot:"Der Fortschritt wird nur in Ihrem Browser gespeichert. Die PDFs auf A4 drucken, beidseitig, an der langen Kante spiegeln, 100 %.",
 g:{tw:["Zungenbrecher für Aussprache, Artikulation und Tempo: Aufwärmen, auf Zeit, Leiter, geteilte Aufmerksamkeit, Live-Räume."],
    id:["Redewendungen und Pressesprache: Bedeutung, Register, Umformulieren und Duelle."],
    bg:["Kabinenübungen: Abkürzungen, Reden auf Zeit, Dilemmata und Registerleitern."],
    cr:["Hauptstadt-Staffel: jedes Land und seine Hauptstadt in all Ihren Sprachen."],
    tp:["Stegreifrede: Thema ziehen und eine vorgegebene Zeit lang sprechen."]}}};
const G=[
 {k:"tw",name:"Twister Booth",c:"var(--c1)",tags:["EN","FR","DE","ASL","Live room"],main:["twister/","all"],ed:[],
  pdf:[["English","print/tongue-twisters/Twister-Booth-English-cards.pdf"],["Français","print/tongue-twisters/Twister-Booth-Francais-cards.pdf"],["Deutsch","print/tongue-twisters/Twister-Booth-Deutsch-cards.pdf"],["FR–EN","print/tongue-twisters/Twister-Booth-FR-EN-cards.pdf"],["FR–DE","print/tongue-twisters/Twister-Booth-FR-DE-cards.pdf"]]},
 {k:"id",name:"Idiom Booth",c:"var(--c2)",tags:["EN","FR","DE","ASL","Duel"],main:["idioms/all.html","all"],ed:[["English","idioms/en.html"],["Français","idioms/fr.html"],["Deutsch","idioms/de.html"]],
  pdf:[["English","print/idioms/Idiom-Booth-English-cards.pdf"],["Français","print/idioms/Idiom-Booth-Francais-cards.pdf"],["Deutsch","print/idioms/Idiom-Booth-Deutsch-cards.pdf"],["FR–EN","print/idioms/Idiom-Booth-FR-EN-cards.pdf"],["FR–DE","print/idioms/Idiom-Booth-FR-DE-cards.pdf"]]},
 {k:"bg",name:"Booth Gym",c:"var(--c3)",tags:["EN","FR","DE"],main:["booth-gym/all.html","all"],ed:[["English","booth-gym/en.html"],["Français","booth-gym/fr.html"],["Deutsch","booth-gym/de.html"]],
  pdf:[["English","print/booth-gym/Booth-Gym-English-cards.pdf"],["Français","print/booth-gym/Booth-Gym-Francais-cards.pdf"],["Deutsch","print/booth-gym/Booth-Gym-Deutsch-cards.pdf"],["FR–EN","print/booth-gym/Booth-Gym-FR-EN-cards.pdf"],["FR–DE","print/booth-gym/Booth-Gym-FR-DE-cards.pdf"]]},
 {k:"cr",name:"Capital Relay",c:"var(--c4)",tags:["EN","FR","DE","Solo"],main:["capitals/","all"],ed:[],
  pdf:[["English","print/world-capitals/Capital-Relay-EN.pdf"],["Français","print/world-capitals/Capital-Relay-FR.pdf"],["Deutsch","print/world-capitals/Capital-Relay-DE.pdf"],["FR–EN","print/world-capitals/Capital-Relay-FR-EN.pdf"],["FR–DE","print/world-capitals/Capital-Relay-FR-DE.pdf"]]},
 {k:"tp",name:"Open Floor · Sujet libre · Freie Rede",c:"var(--c5)",tags:["EN","FR","DE"],main:null,ed:[["Open Floor (English)","topics/en.html"],["Sujet libre (français)","topics/fr.html"],["Freie Rede (Deutsch)","topics/de.html"]],
  pdf:[["Open Floor","print/topic-cards/Open-Floor-cards.pdf"],["Sujet libre","print/topic-cards/Sujet-Libre-cartes.pdf"],["Freie Rede","print/topic-cards/Freie-Rede-Karten.pdf"]]}];
const PLAN=[["Interpreting Level Test","print/level-test-plan/Interpreting-Level-Test.pdf"],["12-Week Training Plan","print/level-test-plan/12-Week-Training-Plan.pdf"]];
const $=s=>document.querySelector(s);
function render(l){const t=T[l];document.documentElement.lang=l;
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
 $("#t-lead").textContent=t.lead;$("#t-fh").textContent=t.fh;$("#t-fl").innerHTML=t.fl.map(x=>`<li>${x}</li>`).join("");
 $("#t-ph").textContent=t.ph;$("#t-pt").textContent=t.pt;$("#t-foot").textContent=t.foot;
 $("#plan").innerHTML=PLAN.map(p=>`<li><a href="${p[1]}">${p[0]}</a> (PDF)</li>`).join("");
 $("#games").innerHTML=G.map(g=>`<article class="game" style="--c:${g.c}"><div class="band"></div><div class="gb">
  <h2>${g.name}</h2><p>${t.g[g.k][0]}</p><div class="tags">${g.tags.map(x=>`<span class="tag">${x}</span>`).join("")}</div>
  <div class="play">${g.main?`<a class="main" href="${g.main[0]}">${t.play}${g.ed.length?" · "+t.all:""}</a>`:""}${g.ed.map((e,i)=>`<a class="${!g.main&&i===0?"main":""}" href="${e[1]}">${g.main?e[0]:t.play+" · "+e[0]}</a>`).join("")}</div>
  <details><summary>${t.print}</summary><ul>${g.pdf.map(p=>`<li><a href="${p[1]}">${p[0]}</a></li>`).join("")}</ul></details>
 </div></article>`).join("")}
let L="en";try{L=localStorage.getItem("twb-ui")||(navigator.language||"en").slice(0,2)}catch(e){}
if(!T[L])L="en";
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{try{localStorage.setItem("twb-ui",b.dataset.l)}catch(e){}render(b.dataset.l)});
render(L);
}
</script>
</body>
</html>
