<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lane Runner · Interpreter Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{--bg:#10151d;--panel:#1a212c;--ink:#eef2f7;--muted:#9aa6b4;--line:#2c3644;--c:#e0a526;--ok:#2fa36b;--bad:#d2493c;--l0:#2b8cc4;--l1:#9b5de5;--l2:#e0568f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 "Source Serif 4",Georgia,serif;overscroll-behavior:none}
h1,h2,h3,button,select,input,.g{font-family:"Familjen Grotesk",Arial,sans-serif}
button,select{font-weight:600;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer}
input{font-size:17px;color:var(--ink);background:#0b0f15;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
button.pri{background:var(--c);color:#1a1300;border-color:var(--c);font-size:17px;padding:12px 22px}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a{color:var(--c)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(3vw,12px) 6px;font:600 16px "Familjen Grotesk",sans-serif;flex-wrap:wrap}
.hud a{color:var(--ink);text-decoration:none}
.hud .st{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pl{display:inline-flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.pl i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pl.out{opacity:.45}
.hearts{color:var(--bad);letter-spacing:1px}
.stage{position:relative;flex:1;touch-action:none;min-height:160px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.dock{padding:8px max(3vw,10px) max(10px,env(safe-area-inset-bottom));background:#0b0f15;border-top:1px solid var(--line)}
.dock .in{max-width:1000px;margin:0 auto}
.qk{font:700 13px "Familjen Grotesk",sans-serif;color:var(--c);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.qt{font:700 clamp(26px,6.4vw,44px)/1.15 "Familjen Grotesk",sans-serif;text-align:center;text-wrap:balance;margin:2px 0 8px}
.qt .flag{height:clamp(70px,15vh,130px);border-radius:8px;box-shadow:0 4px 18px #0008;display:block;margin:4px auto 0;background:#fff}
.qt.long{font-size:clamp(21px,4.8vw,32px)}
.opts{display:grid;gap:8px}
.opt{position:relative;font:700 clamp(19px,4.6vw,30px)/1.2 "Familjen Grotesk",sans-serif;background:var(--panel);border:3px solid var(--lc);border-radius:14px;padding:12px 10px;display:flex;align-items:center;justify-content:center;text-align:center;min-height:72px;cursor:pointer;text-wrap:balance}
.opt.long{font-size:clamp(15px,3.4vw,21px)}
.opt.on{background:color-mix(in srgb,var(--lc) 35%,var(--panel));box-shadow:0 0 0 3px #fff inset}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .who{position:absolute;top:-10px;display:flex;gap:4px}.opt .who b{font:700 12px "Familjen Grotesk",sans-serif;border-radius:999px;padding:2px 7px;color:#10151d}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--bad);color:#fff;font:700 clamp(20px,4.5vw,28px) "Familjen Grotesk",sans-serif;padding:10px 18px;border-radius:12px;max-width:92%;text-align:center;display:none;z-index:2}
.pzb{min-height:40px;padding:6px 14px;background:var(--c);color:#1a1300;border-color:var(--c);font-size:16px}
.pov{position:absolute;inset:0;background:#0b0f15cc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:4}.pov.on{display:flex}.pov h2{margin:0;font:700 40px "Familjen Grotesk",sans-serif}.pov button{font-size:22px;padding:16px 34px;min-height:64px}
.toast.ok{background:var(--ok)}
.cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:800 140px "Familjen Grotesk",sans-serif;color:var(--c);z-index:3;pointer-events:none}
.ov{position:fixed;inset:0;background:#0b0f15f5;overflow:auto;display:none;padding:22px max(4vw,16px) 40px;z-index:5}
.ov.on{display:block}
.box{max-width:700px;margin:0 auto;display:grid;gap:12px}
.box h1{font-size:clamp(30px,6vw,42px);margin:0;line-height:1.1}.box h2{font-size:21px;margin:8px 0 0}
.box p{margin:0;color:#cfd7e1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font:700 13px "Familjen Grotesk",sans-serif;color:var(--muted);width:100%;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
.big{font:700 54px/1 "Familjen Grotesk",sans-serif;color:var(--c)}
.rv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px}
.rv b{font-family:"Familjen Grotesk",sans-serif}.rv .m{color:var(--muted);font-size:15px}
.chal,.race{background:#e0a52618;border:1px solid var(--c);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.code{font:800 38px "Familjen Grotesk",sans-serif;letter-spacing:.18em;color:var(--c)}
.rank{display:grid;gap:6px}.rank div{display:flex;justify-content:space-between;background:var(--panel);border-radius:10px;padding:8px 12px;font:600 17px "Familjen Grotesk",sans-serif}
.lang{display:flex;gap:6px}.lang button{min-height:34px;padding:5px 10px;font-size:13px;border-radius:999px}
.muted{color:var(--muted)}
</style>
</head>

 const race=mode==="race"&&R.room?`<div class="race"><b>${t.rank}</b><div class="rank" id="rank"></div>${R.host?`<button class="pri" id="rag">${t.again2}</button>`:`<span class="muted">${t.hostwait}</span>`}</div>`:"";
 const btns=mode==="race"?`<div class="row"><button id="mn">${t.leave}</button></div>`:`<div class="row"><button class="pri" id="ag">${t.again}</button><button id="mn">${t.menu}</button>${mode!=="duo"?`<button id="sh">${t.share}</button>`:""}<a href="../learn/#${HUB[cfg.pack]}">${t.learn}</a></div>`;
 const mist=P.flatMap(p=>p.mist.map(m=>Object.assign({who:P.length>1?p.name:""},m)));
 $("#over").innerHTML=`<div class="box">${head}${race}${ch}${xpb}${btns}
 <h2>${t.rev}</h2>${mist.length?mist.map(m=>`<div class="rv"><div class="m">${m.who?esc(m.who)+" · ":""}${esc(m.k)}</div>${m.img?`<img src="${m.img}" alt="" style="height:28px;vertical-align:middle;margin-right:6px;border-radius:3px">`:""}<b>${esc(m.q)}</b> → <b style="color:#5fd39a">${esc(m.a)}</b><div class="m">${t.you}: <s>${esc(m.y)}</s>${m.n?" · "+esc(m.n):""}</div></div>`).join(""):`<p>${t.none}</p>`}</div>`;
 $("#over").classList.add("on");
 const ag=$("#ag");if(ag)ag.onclick=()=>newRun();const rag=$("#rag");if(rag)rag.onclick=()=>R.start();
 $("#mn").onclick=()=>{challenge=null;if(mode==="race")R.leave();showMenu()};
 const sh=$("#sh");if(sh)sh.onclick=async()=>{let nm=myName;nm=prompt(t.name,nm)??nm;myName=nm;try{localStorage.setItem("lr-name",nm)}catch(e){}
  const u=location.origin+location.pathname+"#"+(mode==="daily"?"mix":cfg.pack)+"?seed="+seed+"&beat="+me.score+"&by="+encodeURIComponent(nm)+"&lang="+cfg.lang+"&to="+cfg.to+"&lanes="+(mode==="daily"?2:cfg.lanes)+"&sp="+(mode==="daily"?1:cfg.speed)+(cfg.cont&&mode!=="daily"?"&cont="+cfg.cont:"");
  try{if(navigator.share){await navigator.share({title:"Lane Runner",text:t.chal(nm,me.score),url:u});return}}catch(e){}
  try{await navigator.clipboard.writeText(u);toast(t.copied,1)}catch(e){prompt("",u)}};
 R.rank()}
// ---------- online race ----------
const R={room:null,host:false,code:"",go:0,list:[],status:"",
 others(){return this.list.filter(x=>!x.isMe).map(x=>x.presence).filter(p=>p&&p.n)},
 hostP(){const h=this.list.find(x=>x.presence&&x.presence.h);return h?h.presence:null},
 async open(asHost,code){if(!myName){toast(t.yname,0);return}try{localStorage.setItem("lr-name",myName)}catch(e){}
  this.host=asHost;this.code=asHost?[...Array(4)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join(""):code.toUpperCase().replace(/[^A-Z]/g,"");
  if(!this.code)return;this.status=t.conn;showMenu();
  try{this.room=await TWROOM.join("lr-"+this.code.toLowerCase(),asHost)}catch(e){this.room=null;this.status=t.fail;showMenu();return}
  this.status="";const p={n:myName.slice(0,24),s:0,l:3,d:0,go:0};if(asHost)Object.assign(p,{h:1,cfg,seed:0});await this.room.presence(p);
  this.room.onPeers(ch=>{this.list=ch.peers;this.sync()});showMenu()},
 sync(){const h=this.hostP();
  if(!this.host&&h&&h.go&&h.go!==this.go){this.go=h.go;Object.assign(cfg,h.cfg);this.countdown(h.seed);return}
  if(G&&(G.state==="run"||G.state==="pause"||G.state==="dying"))hud();else if(G&&G.state==="over")this.rank();else if($("#menu").classList.contains("on"))this.lobby()},
 start(){if(!this.host)return;this.go=(this.go||0)+1;const sd=(Math.random()*1e9)>>>0;this.room.presence({cfg,seed:sd,go:this.go,s:0,l:3,d:0});this.countdown(sd)},
 countdown(sd){$("#menu").classList.remove("on");$("#over").classList.remove("on");const cd=$("#cd");cd.style.display="flex";let n=3;
  const tick=()=>{if(n>0){SFX.tick();cd.textContent=n;n--;setTimeout(tick,800)}else{cd.style.display="none";newRun(sd)}};tick()},
 rank(){const e=$("#rank");if(!e||mode!=="race")return;const me=G?G.P[0]:null;const all=this.others().filter(o=>o.go===this.go).concat(me?[{n:myName,s:me.score,l:me.lives,d:1,me:1}]:[]);
  all.sort((a,b)=>(b.s||0)-(a.s||0));e.innerHTML=all.map((o,i)=>`<div><span>${i+1}. ${esc(o.n)}${o.me?" ★":""}</span><span>${o.s||0}${o.d?"":" · "+t.running}</span></div>`).join("")},
 lobby(){const e=$("#lobby");if(!e)return;const ps=this.list.map(x=>x.presence).filter(p=>p&&p.n);e.innerHTML=ps.map(p=>`<div><span>${esc(p.n)}${p.h?" ★":""}</span></div>`).join("")},
 leave(){try{this.room&&this.room.leave()}catch(e){}this.room=null;this.list=[];this.go=0;this.code=""}};
// ---------- menu ----------
function showMenu(){SFX.stop();$("#pov").classList.remove("on");if(G&&G.state!=="over")G.state="menu";if(saved){cfg=saved;saved=null}
 const P=Object.keys(t.P),needTo=cfg.pack==="idioms"||cfg.pack==="vocab"||cfg.pack==="mix",cap=/^(capitals|flags)/.test(cfg.pack)||cfg.pack==="mix";
 const b=(k,v,lab)=>`<button data-k="${k}" data-v="${v}" aria-pressed="${String(cfg[k])===String(v)}">${lab}</button>`;
 const mb=(v,lab)=>`<button data-m="${v}" aria-pressed="${mode===v}">${lab}</button>`;
 const xi=XP.info();
 const ch=challenge&&mode==="solo"?`<div class="chal">${esc(t.chal(challenge.by,challenge.beat))}</div>`:"";
 const guestInRace=mode==="race"&&R.room&&!R.host;
 const settings=mode==="daily"?`<div class="chal">${t.dailyT}<span class="muted">${t.dailyBest}: ${best()}</span></div><div class="lbl">${t.lang}</div><div class="row">${["en","fr","de"].map(l=>b("lang",l,l.toUpperCase())).join("")}</div>`:
  guestInRace?"":`<div class="lbl">${t.pack}</div><div class="row">${P.map(p=>b("pack",p,t.P[p])).join("")}</div>
 <div class="lbl">${needTo?t.from:t.lang}</div><div class="row">${["en","fr","de"].map(l=>b("lang",l,l.toUpperCase())).join("")}</div>
 ${needTo?`<div class="lbl">${t.to}</div><div class="row">${["en","fr","de"].filter(l=>l!==cfg.lang).map(l=>b("to",l,l.toUpperCase())).join("")}</div>`:""}
 ${cap?`<div class="lbl">${t.cont}</div><div class="row">${b("cont","",t.world)}${Object.keys(C.CP.CONTINENTS).map(c=>b("cont",c,C.CP.CONTINENTS[c][UI])).join("")}</div>`:""}
 <div class="lbl">${t.lanes}</div><div class="row">${b("lanes",2,"2")}${b("lanes",3,"3")}</div>
 <div class="lbl">${t.speed}</div><div class="row">${b("speed",.75,t.slow)}${b("speed",1,t.norm)}${b("speed",1.35,t.fast)}</div>`;
 let action;
 if(mode==="race"){action=!R.room?`<div class="race"><div class="lbl">${t.yname}</div><input id="nm" maxlength="24" value="${esc(myName)}" autocomplete="nickname">
   <div class="row"><button class="pri" id="rc">${t.create}</button></div><div class="lbl">${t.code}</div><div class="row"><input id="rcode" maxlength="4" style="width:9em;text-transform:uppercase;letter-spacing:.15em" placeholder="ABCD"><button id="rj">${t.join}</button></div>
   ${R.status?`<p>${esc(R.status)}</p>`:""}<p class="muted">${t.share2}</p></div>`
  :`<div class="race"><div class="lbl">${t.code}</div><div class="code">${R.code}</div><p class="muted">${t.share2}</p><div class="lbl">${t.waiting}</div><div class="rank" id="lobby"></div>
   <div class="row">${R.host?`<button class="pri" id="rs">${t.go} →</button>`:`<span class="muted">${t.hostwait}</span>`}<button id="rl">${t.leave}</button></div></div>`}
 else action=`<div class="row" style="margin-top:8px"><button class="pri" id="go">${t.start} →</button><span class="muted">${mode==="daily"?t.dailyBest:t.best}: ${best()}</span></div>
  <p class="muted" style="font-size:15px">${mode==="duo"?t.duoKeys:t.keys}</p>`;
 $("#menu").innerHTML=`<div class="box"><div class="row" style="justify-content:space-between"><a href="../" style="color:var(--ink);text-decoration:none;font:600 15px 'Familjen Grotesk',sans-serif">${t.all}</a><div class="lang">${["en","fr","de"].map(l=>`<button data-ui="${l}" aria-pressed="${l===UI}">${l.toUpperCase()}</button>`).join("")}</div></div>
 <h1>${t.title}</h1><p>${t.lead}</p>
 <div class="row muted" style="font:600 15px 'Familjen Grotesk',sans-serif">${t.lvl} ${xi.level} · ${xi.xp} ${t.xp} · ${t.goal} ${Math.min(xi.today,xi.goal)}/${xi.goal}${xi.streak?" · 🔥 "+t.streakD(xi.streak):""}</div>${ch}
 <div class="lbl">${t.mode}</div><div class="row">${mb("solo",t.solo)}${mb("daily","📅 "+t.daily)}${mb("duo",t.duo)}${mb("race",t.race)}</div>
 ${settings}${action}</div>`;
 $("#menu").classList.add("on");$("#over").classList.remove("on");
 const M_=$("#menu");
 M_.querySelectorAll("[data-k]").forEach(e=>e.onclick=()=>{const k=e.dataset.k;let v=e.dataset.v;if(k==="lanes"||k==="speed")v=+v;cfg[k]=v;if(cfg.to===cfg.lang)cfg.to=cfg.lang==="en"?"fr":"en";
  challenge=null;try{localStorage.setItem("lr-cfg",JSON.stringify(cfg))}catch(x){}history.replaceState(null,"","#"+cfg.pack);if(R.room&&R.host)R.room.presence({cfg});showMenu()});
 M_.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{if(mode==="race"&&e.dataset.m!=="race")R.leave();mode=e.dataset.m;challenge=null;try{localStorage.setItem("lr-mode",mode==="daily"?"solo":mode)}catch(x){}showMenu()});
 M_.querySelectorAll("[data-ui]").forEach(e=>e.onclick=()=>{UI=e.dataset.ui;t=S[UI];try{localStorage.setItem("twb-ui",UI)}catch(x){}applyUI();showMenu()});
 const go=$("#go");if(go)go.onclick=()=>newRun();
 const nm=$("#nm");if(nm)nm.oninput=()=>{myName=nm.value.trim()};
 const rc=$("#rc");if(rc)rc.onclick=()=>R.open(true);const rj=$("#rj");if(rj)rj.onclick=()=>R.open(false,$("#rcode").value);
 const rs=$("#rs");if(rs)rs.onclick=()=>R.start();const rl=$("#rl");if(rl)rl.onclick=()=>{R.leave();showMenu()};
 R.lobby();
 if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
function applyUI(){document.documentElement.lang=UI;$("#back").textContent=t.all;$("#pz").textContent="⏸ "+t.pause}
// ---------- input ----------
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const duo=G&&G.P.length>1,k=e.key;
 if(k==="a"||k==="A"){move(0,-1);e.preventDefault()}else if(k==="d"||k==="D"){move(0,1);e.preventDefault()}
 else if(k==="ArrowLeft"){move(duo?1:0,-1);e.preventDefault()}else if(k==="ArrowRight"){move(duo?1:0,1);e.preventDefault()}
 else if(k===" "||k==="Escape"){if(G&&(G.state==="run"||G.state==="pause")&&mode!=="race"){togglePause();e.preventDefault()}}
 else if(k==="Enter"&&$("#menu").classList.contains("on")&&mode!=="race")newRun()});
const st=$("#stage");const downs=new Map();
st.addEventListener("pointerdown",e=>{downs.set(e.pointerId,e.clientX)});
st.addEventListener("pointerup",e=>{if(!downs.has(e.pointerId)||!G||!G.q)return;const sx=downs.get(e.pointerId);downs.delete(e.pointerId);const r=st.getBoundingClientRect(),x=e.clientX-r.left;
 const vs=views(),vi=vs.length>1?(x<W/2?0:1):0,v=vs[vi],dx=e.clientX-sx;
 if(Math.abs(dx)>30)return move(vi,dx>0?1:-1);const n=G.q.lanes.length;let best_=0,bd=1e9;for(let l=0;l<n;l++){const d=Math.abs(laneX(v,l,1)-x);if(d<bd){bd=d;best_=l}}move(vi,0,best_)});
$("#opts").addEventListener("click",e=>{const o=e.target.closest(".opt");if(o&&G&&G.P.length===1)move(0,0,+o.dataset.i)});
function togglePause(){if(G.state==="run"){G.state="pause";SFX.stop();if(window.speechSynthesis)speechSynthesis.pause();$("#pz").textContent="▶ "+t.play;$("#povh").textContent=t.paused;$("#pres").textContent="▶ "+t.play;$("#pmenu").textContent=t.menu;$("#pov").classList.add("on")}else if(G.state==="pause"){G.state="run";SFX.music("run");if(window.speechSynthesis)speechSynthesis.resume();$("#pz").textContent="⏸ "+t.pause;$("#pov").classList.remove("on");last=performance.now()}}
$("#pres").onclick=()=>{if(G&&G.state==="pause")togglePause()};$("#pmenu").onclick=()=>{$("#pov").classList.remove("on");G.state="menu";showMenu()};
$("#mu").onclick=()=>{const v=!SFX.get("music");SFX.set("music",v);setMuBtn();if(v&&G&&G.state==="run")SFX.music("run")};
function setMuBtn(){$("#mu").textContent=SFX.get("music")?"🎵":"🎵";$("#mu").setAttribute("aria-pressed",SFX.get("music"))}
$("#vc").onclick=()=>{voiceOn=!voiceOn;try{localStorage.setItem("lr-voice",voiceOn?"1":"0")}catch(e){}setVoiceBtn();if(!voiceOn&&window.speechSynthesis)speechSynthesis.cancel();else if(G&&G.q)say(G.q)};
$("#pz").onclick=()=>{if(G&&(G.state==="run"||G.state==="pause")&&mode!=="race")togglePause()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G&&G.state==="run"&&mode!=="race")togglePause()});
addEventListener("hashchange",()=>location.reload());
applyUI();size();setVoiceBtn();setMuBtn();showMenu();
