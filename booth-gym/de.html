<style>
/* Layout: an interpreter's console. Top strip = meters (level, streak, daily goal); body = four channel selectors, each opening a game. */
:root{
  --bg:#EDF1EF; --panel:#FFFFFF; --ink:#14232B; --muted:#5A6A6E; --line:#D2DBD9;
  --accent:#0E6E6B; --accent-soft:#D8ECE9; --signal:#D97A12; --signal-soft:#FBEBD6;
  --good:#2C7A4B; --good-soft:#DCEFE2; --bad:#B23A3A; --bad-soft:#F6DEDE;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1619; --panel:#16232A; --ink:#E5EEEC; --muted:#93A5A7; --line:#27383E;
  --accent:#4DB6AF; --accent-soft:#163A3A; --signal:#F0A445; --signal-soft:#3A2A14;
  --good:#5CC287; --good-soft:#173826; --bad:#E57A7A; --bad-soft:#3D1D1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1619; --panel:#16232A; --ink:#E5EEEC; --muted:#93A5A7; --line:#27383E;
  --accent:#4DB6AF; --accent-soft:#163A3A; --signal:#F0A445; --signal-soft:#3A2A14;
  --good:#5CC287; --good-soft:#173826; --bad:#E57A7A; --bad-soft:#3D1D1F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;font-stretch:80%;letter-spacing:-.01em}
h2{font-size:24px;font-weight:750;font-stretch:85%}
h3{font-size:18px;font-weight:700;font-stretch:90%}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--panel);padding:10px 18px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}

/* top strip */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.lamp{width:14px;height:14px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 2px var(--panel);flex:none;transition:background .3s}
.lamp.on{background:var(--signal);box-shadow:0 0 0 4px var(--signal-soft)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.meter{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.meter b{font-family:var(--display);font-size:22px;font-weight:750;font-stretch:85%;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .6s}
.ticks{display:flex;gap:4px}
.ticks i{flex:1;height:6px;border-radius:3px;background:var(--signal-soft)}
.ticks i.on{background:var(--signal)}

/* channels */
.channels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ch{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;transition:border-color .15s,transform .15s}
.ch:hover{border-color:var(--accent);transform:translateY(-1px)}
.knob{grid-row:span 3;width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent)}
.ch p{margin:0;color:var(--muted);font-size:14px}
.ch .best{font-family:var(--mono);font-size:12px;color:var(--ink)}
.today{background:var(--signal-soft);border-radius:10px;padding:16px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.today .q{font-family:var(--display);font-size:20px;font-weight:700;font-stretch:88%;min-width:0;flex:1 1 280px}

/* game stage */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.stagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hud{display:flex;gap:16px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hud b{color:var(--accent)}
.timer{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--signal);width:100%}
.prompt{font-family:var(--display);font-size:clamp(26px,6vw,44px);font-weight:800;font-stretch:78%;line-height:1.05;overflow-wrap:anywhere}
.sub{font-size:16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.combo{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:10px;background:var(--signal-soft);color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:13px}
.trio div{background:var(--bg);border-radius:6px;padding:8px;min-width:0;overflow-wrap:anywhere}
.trio b{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px}

/* floor time */
.dial{display:grid;place-items:center;position:relative;width:200px;height:200px;margin:0 auto;max-width:100%}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial .t{font-family:var(--mono);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--accent)}

/* ladder */
.tiles{display:grid;gap:8px}
.tile{padding:14px;border:1px dashed var(--line);border-radius:8px;background:var(--bg);text-align:left;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.tile.picked{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.tile .n{font-family:var(--mono);font-size:13px;color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.big{font-family:var(--display);font-size:56px;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
footer{font-size:13px;color:var(--muted)}
@media (max-width:560px){.channels{grid-template-columns:1fr}.meters{grid-template-columns:1fr 1fr}.meters .meter:first-child{grid-column:span 2}.trio{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const QTIME=10;

function acroQuestion(item){
  if(PAIR.length===1){const L=PAIR[0],a=item[LI[L]],f=item[LI[L]+1];const types=[];
    if(a!=="—"){types.push({q:a,sub:T.stand,ans:f,pool:x=>x[LI[L]+1],filter:x=>x[LI[L]]!=="—"});types.push({q:f,sub:T.which,ans:a,pool:x=>x[LI[L]],filter:x=>x[LI[L]]!=="—",small:true});}
    else types.push({q:f,sub:T.which,ans:a,pool:x=>x[LI[L]+1],small:true});
    const t=pick(types);const wrong=shuffle(ACRONYMS.filter(x=>x[0]!==item[0]&&(!t.filter||t.filter(x)))).map(t.pool).filter((v,i,arr)=>v!==t.ans&&arr.indexOf(v)===i).slice(0,3);
    return {...t,item,opts:shuffle([t.ans,...wrong]),dom:item[7]};}
  const k=item[0],dom=item[7];const [A,B]=shuffle(PAIR);
  const acr=L=>item[LI[L]],full=L=>item[LI[L]+1];
  const types=[];
  for(const L of [A,B]){if(acr(L)!=="—")types.push({q:acr(L),sub:`${LN[L]}. What does it stand for?`,ans:full(L),pool:x=>x[LI[L]+1],filter:x=>x[LI[L]]!=="—"});}
  types.push({q:full(A),sub:`What is it called in ${LN[B]}?`,ans:full(B),pool:x=>x[LI[B]+1],small:true});
  if(acr(A)!=="—"&&acr(B)!=="—"&&acr(A)!==acr(B))types.push({q:acr(A),sub:`What is the ${LN[B]} acronym?`,ans:acr(B),pool:x=>x[LI[B]],filter:x=>x[LI[B]]!=="—"&&x[LI[B]]!==x[LI[A]]});
  const t=pick(types);
  const wrong=shuffle(ACRONYMS.filter(x=>x[0]!==k&&(!t.filter||t.filter(x)))).map(t.pool).filter((v,i,a)=>v!==t.ans&&a.indexOf(v)===i).slice(0,3);
  return {...t,item,opts:shuffle([t.ans,...wrong]),dom};
}
function acro(){
  const ACRO=ACRONYMS.filter(a=>PAIR.length>1||a[LI[PAIR[0]]]!=="—");const missed=ACRO.filter(a=>S.missed.includes(a[0]));

  while(deck.length<10){const src=(missed.length&&Math.random()<.4)?pick(missed):fresh.pop();if(src&&!deck.includes(src))deck.push(src)}
  let i=0,score=0,combo=0,right=0,timer=null,wrongs=[];
  const stage=el("div",{class:"stage"});show(stage,true);lamp(true);
  cleanup=()=>clearInterval(timer);
  function q(){

    const bar=el("i");

    const fb=el("div");
    stage.replaceChildren(
      el("div",{class:"stagehead"},el("div",{class:"label"},`CH01 · Akronym-Blitz · ${DOMS[Q.dom]||Q.dom}`),el("div",{class:"hud"},el("span",{},`Q ${i+1}/10`),el("span",{},"Punkte ",el("b",{},score)),combo>=3?el("span",{class:"combo"},`×${mult()} combo`):null)),
      el("div",{class:"timer"},bar),
      el("div",{class:Q.small?"prompt sub":"prompt",style:Q.small?"font-size:clamp(20px,4.4vw,28px)":""},Q.q),
      el("div",{class:"muted"},Q.sub),
      el("div",{class:"opts"},opts),fb);
    clearInterval(timer);
    timer=setInterval(()=>{left--;bar.style.width=(left/(QTIME*10)*100)+"%";if(left<=0)answer(null)},100);
    function answer(o){
      if(done)return;done=true;clearInterval(timer);
      const ok=o===Q.ans;
      opts.forEach(b=>{b.disabled=true;if(b.textContent===Q.ans)b.classList.add("right");else if(b.textContent===o)b.classList.add("wrong")});
      const k=Q.item[0];
      if(ok){combo++;right++;const pts=Math.round((10+Math.ceil(left/10))*mult());score+=pts;S.missed=S.missed.filter(x=>x!==k)}
      else{combo=0;if(!S.missed.includes(k))S.missed.push(k);wrongs.push(Q.item)}
      save();
      fb.replaceChildren(el("div",{class:"trio"},trio(Q.item)),el("div",{class:"row",style:"margin-top:12px"},el("button",{class:"btn",onclick:()=>{i++;q()}},i<9?"Weiter":"Ergebnisse"),el("span",{class:"muted"},ok?"Richtig.":o===null?"Zeit abgelaufen.":"Nicht ganz.")));
      fb.querySelector(".btn").focus();

    stage.replaceChildren(el("div",{class:"result"},el("div",{class:"label"},"Runde beendet"),el("div",{class:"big"},score),el("div",{},`${right}/10 richtig · +${xp} XP${rec?" · neuer Rekord":""}`)),
      wrongs.length?el("div",{class:"review"},el("h3",{},"Wiederholen Sie diese. Sie kommen wieder."),wrongs.map(w=>el("div",{},PAIR.length>1?el("div",{style:"font-weight:600;margin-bottom:4px"},w[2]):null,el("div",{class:"trio"},trio(w))))):el("p",{class:"note"},"Fehlerfrei. Alles richtig."),
      el("div",{class:"row"},el("button",{class:"btn",onclick:acro},"Nochmal spielen"),el("button",{class:"btn ghost",onclick:home},"Zurück zur Konsole")));
  }

}

    const tiles=shuffle(words).map(w=>{const b=el("button",{class:"tile",onclick:()=>tap(w,b)},el("span",{},w),el("span",{class:"n"},""));return b});
    const fb=el("div");
