<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Learn · Interpreter Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f3f1ec,#11141a);--panel:light-dark(#fff,#1a1f27);--ink:light-dark(#16202c,#e8ecf2);--muted:light-dark(#5b6675,#9aa6b4);--line:light-dark(#dcd8cf,#2b3440);--c:#1f5e8c;--soft:light-dark(#eef2f6,#222a35)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Serif 4",Georgia,serif}
h1,h2,h3{font-family:"Familjen Grotesk",Arial,sans-serif;margin:0;line-height:1.15;text-wrap:balance}
.top{background:var(--c);color:#fff;padding:20px max(4vw,16px) 22px}
.top .in,main{max-width:980px;margin:0 auto}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.nav a{color:#fff;font:600 15px "Familjen Grotesk",sans-serif;text-decoration:none}
.lang{display:flex;gap:6px}.lang button{font:600 13px "Familjen Grotesk",sans-serif;background:transparent;color:#fff;border:1px solid #ffffff66;border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.lang button[aria-pressed=true]{background:#fff;color:#16202c}
.top h1{font-size:clamp(28px,5vw,42px);margin-top:16px}.top p{margin:6px 0 0;color:#e6edf5;max-width:62ch}
.games{display:flex;gap:6px;overflow-x:auto;margin-top:16px;padding-bottom:2px}
.games a{flex:none;color:#fff;text-decoration:none;font:600 14.5px "Familjen Grotesk",sans-serif;border:1px solid #ffffff55;border-radius:999px;padding:8px 13px}
.games a[aria-current=page]{background:#fff;color:#16202c}
main{padding:22px max(4vw,16px) 90px;display:grid;gap:18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar button,.bar select,.bar input{font:600 14.5px "Familjen Grotesk",sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 13px;min-height:40px;cursor:pointer}
.bar input{font:16px "Source Serif 4",serif;border-radius:10px;cursor:text}
.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{display:inline-flex;align-items:center;font:600 15px "Familjen Grotesk",sans-serif;background:var(--c);color:#fff;text-decoration:none;border-radius:10px;padding:11px 16px;min-height:44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.card h3{font-size:20px}.muted{color:var(--muted)}.sm{font-size:15px}
.tag{font:600 12px "Familjen Grotesk",sans-serif;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.eq{display:grid;grid-template-columns:34px 1fr;gap:4px 8px;font-size:16px}.eq b{font:600 12px "Familjen Grotesk",sans-serif;color:var(--muted);padding-top:3px}
.ex{font-style:italic;color:var(--muted);font-size:15.5px;margin:0}
table{border-collapse:collapse;width:100%;font-size:16px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font:600 13px "Familjen Grotesk",sans-serif;color:var(--muted)}
.hide{background:var(--soft);color:transparent;border-radius:6px;cursor:pointer;user-select:none}
.guide h3{margin-top:6px}.guide ol,.guide ul{margin:4px 0;padding-left:20px}.guide li{margin:3px 0}
.tw{font:600 19px/1.35 "Familjen Grotesk",sans-serif}
.say{font:600 13px "Familjen Grotesk",sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer;min-height:34px}
.back{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));background:#16202c;color:#fff;font:600 14px -apple-system,Arial,sans-serif;padding:10px 14px;border-radius:999px;text-decoration:none;z-index:9}
@media(max-width:600px){table{font-size:15px}}
</style>
</head>
<body>
<header class="top"><div class="in">
 <div class="nav"><a href="../">← <span id="t-all">All games</span></a><div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="de">DE</button></div></div>
 <h1 id="title"></h1><p id="lead"></p>
 <nav class="games" id="games"></nav>
</div></header>
<main id="main"></main>
<script src="../content/data.js"></script><script src="../content/pt.js"></script>

{

let L="en";try{L=localStorage.getItem("twb-ui")||(navigator.language||"en").slice(0,2)}catch(e){}if(!["en","fr","de"].includes(L))L="en";
const LN={en:{en:"English",fr:"French",de:"German",pt:"Portuguese"},fr:{en:"Anglais",fr:"Français",de:"Allemand",pt:"Portugais"},de:{en:"Englisch",fr:"Französisch",de:"Deutsch",pt:"Portugiesisch"}};
const U={
en:{all:"All games",learn:"Learn",practise:"Practise now",run:"Lane Runner",search:"Search",cover:"Hide capitals to test yourself",uncover:"Show capitals",tap:"Tap a hidden capital to reveal it.",country:"Country",capital:"Capital",world:"Whole world",cat:"All categories",lvl:"All levels",listen:"Listen",note:"Watch out",ff:"False friends",ffl:"Words that look the same but do not mean the same.",means:"means",not:"not",acr:"Acronyms",lad:"Register ladders",ladl:"The same idea, from casual to formal. Interpreters move up and down this ladder all day.",casual:"Casual",neutral:"Neutral",formal:"Formal",eth:"Professional ethics",tech:"Articulation basics"},
fr:{all:"Tous les jeux",learn:"Apprendre",practise:"S'entraîner",run:"Lane Runner",search:"Rechercher",cover:"Masquer les capitales pour vous tester",uncover:"Afficher les capitales",tap:"Touchez une capitale masquée pour la révéler.",country:"Pays",capital:"Capitale",world:"Monde entier",cat:"Toutes les catégories",lvl:"Tous les niveaux",listen:"Écouter",note:"Attention",ff:"Faux amis",ffl:"Des mots qui se ressemblent mais ne veulent pas dire la même chose.",means:"signifie",not:"et non",acr:"Sigles",lad:"Échelles de registre",ladl:"La même idée, du familier au soutenu. L'interprète monte et descend cette échelle toute la journée.",casual:"Familier",neutral:"Neutre",formal:"Soutenu",eth:"Déontologie",tech:"Les bases de l'articulation"},
de:{all:"Alle Spiele",learn:"Lernen",practise:"Jetzt üben",run:"Lane Runner",search:"Suchen",cover:"Hauptstädte verdecken und selbst testen",uncover:"Hauptstädte zeigen",tap:"Auf eine verdeckte Hauptstadt tippen, um sie aufzudecken.",country:"Land",capital:"Hauptstadt",world:"Ganze Welt",cat:"Alle Kategorien",lvl:"Alle Stufen",listen:"Anhören",note:"Achtung",ff:"Falsche Freunde",ffl:"Wörter, die gleich aussehen, aber nicht dasselbe bedeuten.",means:"heißt",not:"nicht",acr:"Abkürzungen",lad:"Registerleitern",ladl:"Dieselbe Idee, von salopp bis gehoben. Dolmetscher bewegen sich den ganzen Tag auf dieser Leiter.",casual:"Salopp",neutral:"Neutral",formal:"Gehoben",eth:"Berufsethik",tech:"Grundlagen der Artikulation"}};
const GAMES={
 capitals:{name:"Capital Relay",c:"#b8432f",play:"../capitals/",lead:{en:"Study every country and its capital, region by region, in English, French and German. Then hide the capitals and test yourself.",fr:"Étudiez chaque pays et sa capitale, région par région, en anglais, français et allemand. Puis masquez les capitales et testez-vous.",de:"Lernen Sie jedes Land und seine Hauptstadt, Region für Region, auf Englisch, Französisch und Deutsch. Dann die Hauptstädte verdecken und sich selbst testen."}},
 idioms:{name:"Idiom Booth",c:"#1f5e8c",play:"../idioms/all.html",lead:{en:"Each idiom with its meaning, its equivalents in all three languages, example sentences and the trap to avoid. Then the false friends.",fr:"Chaque expression avec son sens, ses équivalents dans les trois langues, des exemples et le piège à éviter. Puis les faux amis.",de:"Jede Redewendung mit Bedeutung, Entsprechungen in allen drei Sprachen, Beispielsätzen und der Falle, die man vermeiden sollte. Danach die falschen Freunde."}},
 twister:{name:"Twister Booth",c:"#4a2f7a",play:"../twister/",lead:{en:"How each family of sounds is made, then every twister by level. Listen first, then say it slowly before you try for speed.",fr:"Comment se forme chaque famille de sons, puis tous les virelangues par niveau. Écoutez d'abord, dites-le lentement, puis visez la vitesse.",de:"Wie jede Lautgruppe gebildet wird, dann alle Zungenbrecher nach Stufe. Erst anhören, dann langsam sprechen, dann auf Tempo gehen."}},
 booth:{name:"Booth Gym",c:"#2f7d4f",play:"../booth-gym/all.html",lead:{en:"The acronyms every conference interpreter must know, register ladders, and the ethical principles behind the booth dilemmas.",fr:"Les sigles que tout interprète de conférence doit connaître, les échelles de registre et les principes déontologiques derrière les dilemmes de cabine.",de:"Die Abkürzungen, die jeder Konferenzdolmetscher kennen muss, Registerleitern und die ethischen Grundsätze hinter den Kabinen-Dilemmata."}},
 topics:{name:"Open Floor",c:"#a77a12",play:"../topics/"+({en:"en",fr:"fr",de:"de"})[L]+".html",lead:{en:"How to build a strong impromptu speech in two minutes: structures, openings, transitions and closings in three languages.",fr:"Comment construire une bonne prise de parole improvisée en deux minutes : structures, ouvertures, transitions et conclusions en trois langues.",de:"Wie man in zwei Minuten eine starke Stegreifrede aufbaut: Strukturen, Einstiege, Überleitungen und Schlüsse in drei Sprachen."}}};
// guides (original teaching text)
const GUIDE={
eth:{en:[["Confidentiality","Everything you hear in a meeting stays there, before, during and after. No 'off the record' summaries, no names, no social media."],["Accuracy","Render the full message, its tone and its register. Do not add, cut or soften. If you made an error, correct it on the microphone."],["Impartiality","You are the speaker's voice, not their judge. Keep your opinions and reactions out of your voice."],["Competence","Accept only assignments you can do well, and prepare: documents, glossaries, names and acronyms."],["Collegiality","Support your booth partner: write down figures and names, hand over smoothly, never undermine a colleague in public."]],
 fr:[["Confidentialité","Tout ce que vous entendez en réunion y reste, avant, pendant et après. Pas de résumé « officieux », pas de noms, pas de réseaux sociaux."],["Fidélité","Rendez tout le message, son ton et son registre. N'ajoutez, ne coupez et n'adoucissez rien. En cas d'erreur, corrigez-la au micro."],["Impartialité","Vous êtes la voix de l'orateur, pas son juge. Vos opinions et réactions restent hors de votre voix."],["Compétence","N'acceptez que les missions que vous pouvez bien faire, et préparez-vous : documents, glossaires, noms et sigles."],["Confraternité","Soutenez votre collègue de cabine : notez chiffres et noms, passez le relais en douceur, ne désavouez jamais un collègue en public."]],
 de:[["Verschwiegenheit","Alles, was Sie in einer Sitzung hören, bleibt dort, vorher, währenddessen und danach. Keine Zusammenfassung „unter uns“, keine Namen, keine sozialen Medien."],["Genauigkeit","Die ganze Botschaft wiedergeben, mit Ton und Register. Nichts hinzufügen, weglassen oder abschwächen. Fehler am Mikrofon korrigieren."],["Unparteilichkeit","Sie sind die Stimme des Redners, nicht sein Richter. Eigene Meinungen und Reaktionen bleiben aus der Stimme heraus."],["Kompetenz","Nur Einsätze annehmen, die man gut leisten kann, und sich vorbereiten: Unterlagen, Glossare, Namen und Abkürzungen."],["Kollegialität","Die Kabinenpartnerin unterstützen: Zahlen und Namen notieren, sauber übergeben, nie einen Kollegen öffentlich bloßstellen."]]},
speech:{en:{h1:"Three structures that always work",s:[["PREP","Point: say your view in one sentence. Reason: why. Example: one concrete case. Point: repeat your view, a little stronger."],["Past, present, future","How it used to be, how it is now, where it should go. Ideal for topics about change."],["Problem, cause, solution","Name the problem, explain one or two causes, propose a realistic solution and a first step."]],
 h2:"Useful lines",o:["Let me start with a simple question…","When people talk about this, they usually forget one thing…"],t:["Let me give you an example.","On the other hand…","That brings me to my second point."],c:["So, to sum up…","If you remember one thing today, let it be this…"],
 h3:"Before you speak (15 seconds)",p:["Pick your structure.","Find one example you can describe in detail.","Decide your last sentence first: it gives you a destination."],h4:"While you speak",q:["Pause instead of saying um, euh or äh: silence sounds confident.","Look up and slow down at the start and at the end.","One idea per sentence. Short sentences are easier to interpret too."]},
 fr:{h1:"Trois structures qui marchent toujours",s:[["PREP","Point : votre avis en une phrase. Raison : pourquoi. Exemple : un cas concret. Point : redites votre avis, un peu plus fort."],["Passé, présent, avenir","Comment c'était, comment c'est, où il faudrait aller. Idéal pour les sujets sur le changement."],["Problème, cause, solution","Nommez le problème, expliquez une ou deux causes, proposez une solution réaliste et une première étape."]],
 h2:"Formules utiles",o:["Permettez-moi de commencer par une question simple…","Quand on parle de ce sujet, on oublie souvent une chose…"],t:["Je vais vous donner un exemple.","D'un autre côté…","Ce qui m'amène à mon deuxième point."],c:["Pour résumer…","S'il ne fallait retenir qu'une chose aujourd'hui, ce serait celle-ci…"],
 h3:"Avant de parler (15 secondes)",p:["Choisissez votre structure.","Trouvez un exemple que vous pouvez décrire en détail.","Décidez d'abord de votre dernière phrase : elle vous donne une destination."],h4:"Pendant que vous parlez",q:["Faites une pause au lieu de dire « euh » : le silence paraît assuré.","Levez les yeux et ralentissez au début et à la fin.","Une idée par phrase. Les phrases courtes sont aussi plus faciles à interpréter."]},
 de:{h1:"Drei Strukturen, die immer funktionieren",s:[["PREP","Punkt: Ihre Meinung in einem Satz. Grund: warum. Beispiel: ein konkreter Fall. Punkt: Meinung wiederholen, etwas stärker."],["Vergangenheit, Gegenwart, Zukunft","Wie es war, wie es ist, wohin es gehen sollte. Ideal für Themen über Wandel."],["Problem, Ursache, Lösung","Problem benennen, ein oder zwei Ursachen erklären, eine realistische Lösung und einen ersten Schritt vorschlagen."]],
 h2:"Nützliche Formulierungen",o:["Lassen Sie mich mit einer einfachen Frage beginnen…","Wenn über dieses Thema gesprochen wird, vergisst man meist eines…"],t:["Ich gebe Ihnen ein Beispiel.","Andererseits…","Damit komme ich zu meinem zweiten Punkt."],c:["Zusammengefasst…","Wenn Sie heute nur eines mitnehmen, dann dies…"],
 h3:"Bevor Sie sprechen (15 Sekunden)",p:["Struktur wählen.","Ein Beispiel finden, das Sie genau beschreiben können.","Zuerst den letzten Satz festlegen: Er gibt Ihnen ein Ziel."],h4:"Während Sie sprechen",q:["Pause statt äh: Stille wirkt sicher.","Am Anfang und am Ende aufschauen und langsamer werden.","Eine Idee pro Satz. Kurze Sätze lassen sich auch leichter dolmetschen."]}}};
const LINES={en:["en","fr","de","pt"],fr:["fr","en","de","pt"],de:["de","en","fr","pt"]};
let G=(location.hash||"#capitals").slice(1);if(!GAMES[G])G="capitals";
const F={cont:"all",cat:"all",lvl:"all",lang:"all",q:"",cover:false};
function header(){const g=GAMES[G],u=U[L];document.documentElement.lang=L;document.documentElement.style.setProperty("--c",g.c);
 document.title=u.learn+" · "+g.name;$("#title").textContent=u.learn+": "+g.name;$("#lead").textContent=g.lead[L];$("#t-all").textContent=u.all;
 $("#games").innerHTML=Object.entries(GAMES).map(([k,v])=>`<a href="#${k}" ${k===G?'aria-current="page"':""}>${v.name}</a>`).join("");
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L))}
const goBtns=()=>`<div class="bar"><a class="go" href="${GAMES[G].play}">${U[L].practise} →</a>${["capitals","idioms","booth"].includes(G)?`<a class="go" style="background:#16202c" href="../runner/#${G}">${U[L].run} →</a>`:""}</div>`;
const V={};
V.capitals=()=>{const u=U[L];const conts=Object.entries(C.CP.CONTINENTS);
 let rows=C.CP.COUNTRIES.filter(c=>(F.cont==="all"||c.continent===F.cont)&&(!F.q||[c.en,c.fr,c.de,c.pt,c.cap.en,c.cap.fr,c.cap.de,c.cap.pt].join(" ").toLowerCase().includes(F.q)));
 const byReg={};rows.forEach(c=>(byReg[c.region]=byReg[c.region]||[]).push(c));
 return `<div class="bar"><button data-cont="all" aria-pressed="${F.cont==="all"}">${u.world}</button>${conts.map(([k,v])=>`<button data-cont="${k}" aria-pressed="${F.cont===k}">${v[L]}</button>`).join("")}</div>
 <div class="bar"><input id="q" type="search" placeholder="${u.search}" value="${esc(F.q)}" aria-label="${u.search}"><button id="cov" aria-pressed="${F.cover}">${F.cover?u.uncover:u.cover}</button></div>${F.cover?`<p class="muted sm">${u.tap}</p>`:""}
 ${Object.entries(byReg).map(([r,cs])=>`<section class="card"><h3>${esc(C.CP.REGIONS[r]?C.CP.REGIONS[r][L]:r)}</h3><table><thead><tr><th>${u.country}</th><th>${u.capital}</th><th>${LINES[L].slice(1).map(l=>LN[L][l]).join(" · ")}</th></tr></thead><tbody>
 ${cs.map(c=>`<tr><td><b>${esc(c[L])}</b></td><td><span class="${F.cover?"hide":""}">${esc(c.cap[L])}</span></td><td class="muted sm"><span class="${F.cover?"hide":""}">${LINES[L].slice(1).map(l=>esc(c.cap[l])).join(" · ")}</span>${c.note?`<br>${esc(c.note)}`:""}</td></tr>`).join("")}</tbody></table></section>`).join("")}`};
V.idioms=()=>{const u=U[L];const cats=[...new Set(C.ID.IDIOMS.map(i=>i.c))];
 const rows=C.ID.IDIOMS.filter(i=>(F.cat==="all"||i.c===F.cat)&&(!F.q||[i.en,i.fr,i.de,i.pt,i.m].join(" ").toLowerCase().includes(F.q)));
 const ff=(C.ID.FF_FE||[]).concat(C.ID.FF_FD||[]);
 return `<div class="bar"><select id="cat" aria-label="${u.cat}"><option value="all">${u.cat}</option>${cats.map(c=>`<option ${F.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select><input id="q" type="search" placeholder="${u.search}" value="${esc(F.q)}" aria-label="${u.search}"></div>
 <div class="grid">${rows.map(i=>{const n=C.ID.NOTES[i.id];return `<article class="card"><div class="bar"><span class="tag">${esc(i.c)}</span><span class="tag">${esc(i.r||"")}</span></div><h3>${esc(i[L])}</h3><p class="muted sm" style="margin:0">${esc(i.m)}</p>
 <div class="eq">${LINES[L].map(l=>`<b>${l.toUpperCase()}</b><span>${esc(i[l])}</span>`).join("")}</div>
 ${(i.x||[]).slice(0,3).map(x=>`<p class="ex">${esc(x)}</p>`).join("")}${(n&&n[L])||i.n?`<p class="sm" style="margin:0"><b>${u.note}:</b> ${esc((n&&n[L])||i.n)}</p>`:""}</article>`}).join("")}</div>
 <section class="card"><h3>${u.ff}</h3><p class="muted sm" style="margin:0">${u.ffl}</p><table><tbody>${ff.map(f=>`<tr><td><b>${esc(f.w)}</b> <span class="tag">${f.l.toUpperCase()}</span></td><td>${u.means} <b>${esc(f.ok)}</b><br><span class="muted sm">${u.not} ${f.bad.map(esc).join(", ")}${f.n?" · "+esc(f.n):""}</span></td></tr>`).join("")}</tbody></table></section>`};
V.twister=()=>{const u=U[L];const tip=C.TW.tip[L],cat=C.TW.cat[L],lv=C.TW.lvl[L];
 const rows=C.TW.T.filter(x=>(F.lang==="all"||x.l===F.lang)&&(F.lvl==="all"||String(x.v)===F.lvl));
 return `<section class="card guide"><h3>${u.tech}</h3><div class="grid">${Object.keys(tip).map(k=>`<div><b>${esc(cat[k])}</b><p class="sm" style="margin:2px 0 0">${esc(tip[k])}</p></div>`).join("")}</div></section>
 <div class="bar"><select id="lang"><option value="all">${u.cat.split(" ")[0]==="All"?"All languages":L==="fr"?"Toutes les langues":"Alle Sprachen"}</option>${["en","fr","de"].map(l=>`<option value="${l}" ${F.lang===l?"selected":""}>${LN[L][l]}</option>`).join("")}<option value="sl" ${F.lang==="sl"?"selected":""}>ASL</option></select>
 <select id="lvl"><option value="all">${u.lvl}</option>${[1,2,3].map(v=>`<option value="${v}" ${F.lvl==String(v)?"selected":""}>${v} · ${lv[v]}</option>`).join("")}</select></div>
 <div class="grid">${rows.map((x,i)=>`<article class="card"><div class="bar"><span class="tag">${x.v} · ${esc(lv[x.v])}</span><span class="tag">${x.l==="sl"?"ASL":x.l.toUpperCase()}</span><span class="tag">${esc(cat[x.c])}</span></div><p class="tw" lang="${x.l==="sl"?"en":x.l}" style="margin:0">${esc(x.t)}</p><p class="muted sm" style="margin:0">${esc(tip[x.c])}</p>${x.l!=="sl"&&"speechSynthesis" in window?`<div class="bar"><button class="say" data-t="${i}" data-r="0.6">▶ ${u.listen}</button></div>`:""}</article>`).join("")}</div>`;};
V.booth=()=>{const u=U[L];const A=C.BG.ACRONYMS;const cats=[...new Set(A.map(a=>a[7]))];
 const rows=A.filter(a=>(F.cat==="all"||a[7]===F.cat)&&(!F.q||a.join(" ").toLowerCase().includes(F.q)));
 const lad=C.BG.LADDERS;
 return `<section class="card"><h3>${u.acr}</h3><div class="bar"><select id="cat"><option value="all">${u.cat}</option>${cats.map(c=>`<option ${F.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select><input id="q" type="search" placeholder="${u.search}" value="${esc(F.q)}" aria-label="${u.search}"></div>
 <table><thead><tr><th>EN</th><th>FR</th><th>DE</th><th>PT</th></tr></thead><tbody>${rows.map(a=>`<tr><td><b>${esc(a[0])}</b><br><span class="sm">${esc(a[2])}</span></td><td><b>${esc(a[3])}</b><br><span class="sm">${esc(a[4])}</span></td><td><b>${esc(a[5])}</b><br><span class="sm">${esc(a[6])}</span></td><td><b>${esc(a[8]||"")}</b><br><span class="sm">${esc(a[9]||"")}</span></td></tr>`).join("")}</tbody></table></section>
 <section class="card"><h3>${u.lad}</h3><p class="muted sm" style="margin:0">${u.ladl}</p><table><thead><tr><th></th><th>${u.casual}</th><th>${u.neutral}</th><th>${u.formal}</th></tr></thead><tbody>${lad.map(r=>`<tr><td><span class="tag">${esc(r[0])}</span><br><span class="sm muted">${esc(r[1])}</span></td>${r[2].map(w=>`<td>${esc(w)}</td>`).join("")}</tr>`).join("")}</tbody></table></section>
 <section class="card guide"><h3>${u.eth}</h3>${GUIDE.eth[L].map(e=>`<div><b>${esc(e[0])}</b><p class="sm" style="margin:2px 0 0">${esc(e[1])}</p></div>`).join("")}</section>`};
V.topics=()=>{const g=GUIDE.speech;const s=g[L];
 return `<section class="card guide"><h3>${s.h1}</h3>${s.s.map(x=>`<div><b>${esc(x[0])}</b><p class="sm" style="margin:2px 0 0">${esc(x[1])}</p></div>`).join("")}</section>
 <section class="card guide"><h3>${s.h3}</h3><ol>${s.p.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><h3>${s.h4}</h3><ul>${s.q.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
 <section class="card guide"><h3>${s.h2}</h3><table><tbody>${["en","fr","de"].map(l=>`<tr><td><span class="tag">${l.toUpperCase()}</span></td><td>${g[l].o.concat(g[l].t,g[l].c).map(x=>esc(x)).join("<br>")}</td></tr>`).join("")}</tbody></table></section>`};
function render(){header();$("#main").innerHTML=goBtns()+V[G]()+goBtns();
 document.querySelectorAll("[data-cont]").forEach(b=>b.onclick=()=>{F.cont=b.dataset.cont;render()});
 const q=$("#q");if(q){q.oninput=()=>{F.q=q.value.toLowerCase().trim();const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
 const cov=$("#cov");if(cov)cov.onclick=()=>{F.cover=!F.cover;render()};
 document.querySelectorAll(".hide").forEach(h=>h.onclick=()=>h.classList.remove("hide"));
 ["cat","lang","lvl"].forEach(k=>{const s=$("#"+k);if(s)s.onchange=()=>{F[k]=s.value;render()}});
 if(G==="twister"){const rows=C.TW.T.filter(x=>(F.lang==="all"||x.l===F.lang)&&(F.lvl==="all"||String(x.v)===F.lvl));
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const x=rows[+b.dataset.t];speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(x.t);ut.lang={en:"en-GB",fr:"fr-FR",de:"de-DE"}[x.l];ut.rate=0.75;speechSynthesis.speak(ut)})}}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(GAMES[h]){G=h;Object.assign(F,{cont:"all",cat:"all",lvl:"all",lang:"all",q:"",cover:false});render();scrollTo(0,0)}});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("twb-ui",L)}catch(e){}GAMES.topics.play="../topics/"+L+".html";render()});
render();
}
</script>
